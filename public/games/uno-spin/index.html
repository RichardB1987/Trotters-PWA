<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNO Spin Wheel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="uno-bg"></div>

  <a href="../../game-hub.html" class="back-link">Back to Games Hub</a>

  <div class="game-container">
    <h1 class="title">UNO SPIN!</h1>

    <div class="wheel-wrapper">
      <div class="pointer"></div>
      <div class="wheel-frame">
        <svg id="wheel-svg" viewBox="-200 -200 400 400"></svg>
      </div>
      <button id="spin-btn" class="spin-btn">SPIN</button>
    </div>

    <div id="result-box" class="result-box">Press SPIN to play!</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
