<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Countdown - Host</title>
    <link rel="stylesheet" href="../../style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --countdown-navy: #003366;
            --countdown-light-blue: #6699cc;
            --countdown-gold: #ffcc00;
            --countdown-tile: #0055aa;
        }
        body { background-color: var(--countdown-navy); color: #fff; font-family: 'Arial', sans-serif; }
        .card { background: #002244; border: 4px solid var(--countdown-light-blue); padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        h2, h3 { color: var(--countdown-gold); text-transform: uppercase; text-align: center; }
        
        /* 9 Letter Tiles */
        #letters-container { display: flex; gap: 15px; margin: 30px 0; justify-content: center; }
        .tile { width: 80px; height: 100px; display: flex; align-items: center; justify-content: center; background: var(--countdown-tile); border: 4px solid var(--countdown-gold); color: white; font-size: 3.5rem; font-weight: 900; text-transform: uppercase; box-shadow: 4px 4px 10px rgba(0,0,0,0.5); border-radius: 8px; }
        
        /* Buttons */
        .pill { background: var(--countdown-tile); color: white; border: 2px solid var(--countdown-light-blue); padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin: 5px; font-size: 1.1rem; }
        .pill:hover { background: var(--countdown-light-blue); }
        .pill:disabled { background: #333; color: #888; border-color: #555; }
        
        /* 30s Clock */
        #timer-display { font-size: 4rem; color: var(--countdown-gold); font-family: 'Courier New', monospace; text-align: center; margin: 20px 0; border: 6px solid var(--countdown-gold); display: block; width: 120px; height: 120px; line-height: 120px; border-radius: 50%; margin: 20px auto; background: #001122; }
        
        /* Scores - Horizontal row */
        #scoreboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; width: 100%; margin-top: 20px; }
        .score-entry { background: #003366; padding: 15px; border-radius: 12px; border: 2px solid var(--countdown-light-blue); text-align: center; }
    </style>
</head>
<body>
    <div class="shell">
        <div class="topbar">
            <div class="brand"><h1>Countdown</h1></div>
            <div class="topbar-meta">
                <button class="pill" onclick="window.location.href='/game-hub.html'">Back to Hub</button>
            </div>
        </div>
                    <button class="pill" onclick="nextRound()">Skip Round</button>


        <div id="view-game" class="view active">
            <div class="card">
                <h2 id="round-info">Letters Round 1</h2>
                <div id="letters-container" style="display:flex; gap:10px; margin: 20px 0;"></div>
                <div class="controls">
                    <button id="vowel-btn" class="pill">Vowel</button>
                    <button id="consonant-btn" class="pill">Consonant</button>
                    <button id="start-clock" class="pill" disabled>Start 30s Clock</button>
                    <button id="reveal-btn" class="pill" style="display:none; background:var(--countdown-gold);">Reveal</button>
                    <button id="reset-buzzer-btn" class="pill" style="display:none; background:#ff4444;">Reset Buzzer</button>
                </div>
                <div style="text-align: center;">
                    <div id="timer-display">30</div>
                </div>
                <div id="buzzer-status" style="margin: 10px 0; font-weight: bold; color: var(--countdown-gold); text-align: center; min-height: 1.5em;"></div>
            </div>
            
            <div class="card">
                <h3>Scores</h3>
                <div id="scoreboard"></div>
                <div id="round-controls" style="margin-top: 20px;"></div>
                <div id="qrcode" style="margin-top: 20px; display: flex; justify-content: center;"></div>
            </div>
        </div>
    </div>
    <script src="countdown.js"></script>
</body>
</html>
