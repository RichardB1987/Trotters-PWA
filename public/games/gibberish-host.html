<head>

    <script>
        let isInGameSession = false;
        let peer = null;
        let conn = null;
        let sessionId = null;
        let roundNumber = 1;
        let score = 0;
        let countdownInterval = null;
        let timerSeconds = 60;
        let SCOREBOARD_KEY = 'gibberish_scoreboard';
        let PLAYERS_KEY = 'gibberish_players';
        let ACTIVE_PLAYER_KEY = 'gibberish_active_player';
        
        const COLORS = ['#ef4444', '#f59e0b', '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'];
        const ICONS = ['👤', '🎭', '#️⃣', '⭐', '🚀', '⚽', '🎯', '🔥'];
        
        // --- In-memory fallback for localStorage blocking ---
        let fallbackPlayerSlots = [];
        
        // --- Tap-Order Selector Logic (Pre-game 8-icon setup) ---
        const ALL_SLOT_PLAYERS = ['Player 1', 'Player 2', 'Player 3', 'Player 4', 'Player 5', 'Player 6', 'Player 7', 'Player 8'];
        
        // --- Safe localStorage helpers ---
        function safeGetItem(key, defaultValue = null) {
            try {
                const value = localStorage.getItem(key);
                return value !== null ? value : defaultValue;
            } catch (e) {
                console.warn('localStorage access blocked for key:', key, e);
                return defaultValue;
            }
        }
        
        function safeSetItem(key, value) {
            try {
                localStorage.setItem(key, value);
                return true;
            } catch (e) {
                console.warn('localStorage access blocked for key:', key, e);
                return false;
            }
        }
        
        function safeRemoveItem(key) {
            try {
                localStorage.removeItem(key);
                return true;
            } catch (e) {
                console.warn('localStorage access blocked for key:', key, e);
                return false;
            }
        }
        
        function safeParseJSON(jsonString, defaultValue = null) {
            try {
                return jsonString ? JSON.parse(jsonString) : defaultValue;
            } catch (e) {
                console.warn('JSON parse error:', e);
                return defaultValue;
            }
        }
        
        function safeStringifyJSON(obj) {
            try {
                return JSON.stringify(obj);
            } catch (e) {
                console.warn('JSON stringify error:', e);
                return null;
            }
        }
    </script>
    <style>

<body>
    <div class="container">
        <header>
            <h1>Gibberish Party</h1>
            <p class="subtitle">Host Display & Game Screen</p>
        </header>

        <!-- Setup / Pairing Screen -->
        <div id="setup-screen" class="card">
            <div class="setup-content">
                <div class="setup-qr-col">
                    <div id="qrcode"></div>
                    <div id="session-info" style="font-size: 0.8rem; color: var(--text-muted); text-align: center;">Generating Session ID...</div>
                </div>
                <div class="setup-info-col">
                    <div class="input-group">
                        <label for="network-ip">PC Network IP (Saved automatically):</label>
                        <input type="text" id="network-ip" placeholder="e.g. 192.168.0.242" oninput="saveAndRefreshIP()">
                    </div>
                    <div class="warning-box">
                        <strong>Scan with phone to judge:</strong> Connected phone controls scoring and reveals answers.
                    </div>
                </div>
            </div>

            <!-- 8-Icon Player Tap-Order Selector -->
            <div class="order-selector-panel">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div style="display: flex; align-items: center; gap: 0.4rem;">
                        <span style="font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Play Order</span>
                        <span style="font-size: 0.75rem; color: var(--text-muted);">(Tap to set order; 1st = Active)</span>
                    </div>
                    <button type="button" class="btn btn-back" style="padding: 0.2rem 0.55rem; font-size: 0.75rem; width: auto; border-radius: 0.4rem;" onclick="clearTapOrder()">Clear</button>
                </div>
                <div id="order-selector-grid" class="order-grid"></div>
            </div>

            <button class="btn btn-pass" onclick="startPassAndPlay()">Pass & Play Fallback (Single Screen)</button>
            <a href="../game-hub.html" class="btn btn-back" style="text-decoration: none; text-align: center; display: block; box-sizing: border-box;" onclick="exitToGameHub(event)">← Back to Game Hub</a>
        </div>

        <!-- Active Game Screen -->
        <div id="game-screen" style="display: none; width: 100%; flex-direction: column; height: 100%;">
            <div class="round-badge" id="round-badge" style="display: none;">Round 1</div>
            <div class="game-container">
                <!-- Left Column: Phrase, Category, Timer/Score, Action Buttons -->
                <div class="game-main-col">
                    <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
                        <span class="subtitle" id="category-val" style="font-weight: 600;">Category</span>
                        <div class="score-display">Score: <span id="score-val" style="color: var(--primary);">0</span> | Time: <span id="timer-val" style="color: var(--correct-color);">60s</span></div>
                    </div>

                    <div class="phrase-display" id="phrase-val">Ready?</div>

                    <div style="width: 100%; display: flex; flex-direction: column; gap: 0.6rem;">
                        <div id="game-controls" style="display: flex; gap: 0.75rem; width: 100%;">
                            <button class="btn" style="background-color: var(--pass-color); padding: 0.75rem;" onclick="nextCard('skip')">Skip</button>
                            <button class="btn" style="background-color: var(--correct-color); padding: 0.75rem;" onclick="nextCard('correct')">Correct!</button>
                        </div>
                        <button id="play-again-btn" class="btn" style="display: none; background-color: var(--primary); padding: 0.75rem;" onclick="resetGame()">Play Again (Next Turn)</button>
                        <a href="../game-hub.html" class="btn btn-back" style="text-decoration: none; text-align: center; display: block; box-sizing: border-box; width: 100%; padding: 0.5rem;" onclick="exitToGameHub(event)">← Exit to Game Hub</a>
                    </div>
                </div>

                <!-- Right Column: Up Next indicator + Scoreboard (no tall cramped scrollbox) -->
                <div class="game-side-col">
                    <!-- Up Next Banner -->
                    <div class="up-next-banner" id="up-next-banner">
                        <span style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em;">Up Next:</span>
                        <span id="up-next-player" style="font-weight: 700; color: var(--text-main); font-size: 0.95rem;">-</span>
                    </div>

                    <!-- Scoreboard & Player Selection -->
                    <div id="scoreboard-container" style="width: 100%; background: rgba(0,0,0,0.2); padding: 0.75rem 0.85rem; border-radius: 0.75rem; box-sizing: border-box; display: flex; flex-direction: column; gap: 0.5rem;">
                        <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.2rem;">
                            <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Scoreboard</span>
                        </div>
                        <div id="players-list" style="display: flex; flex-direction: column; gap: 0.45rem;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global State (using existing declarations from first script block)
        let timerInterval = null;
        let timeLeft = 60;
        let gameRunning = false;
        let currentIndex = 0;
        let allCards = [];
        // peer is already declared in first script block
        let currentPeerId = '';

        // Initialize PeerJS and QR Code
        function initPeer() {
            console.log("Initializing PeerJS...");
            
            // Clean up any existing peer connection first with forced async wait
            if (peer) {
                try {
                    peer.destroy();
                } catch (err) {
                    console.warn("Failed to destroy existing peer during init", err);
                }
                peer = null;
            }
            
            // Ensure complete cleanup with small delay
            return new Promise((resolve) => {
                setTimeout(() => {
                    const randomId = 'gibberish-' + Math.random().toString(36).substring(2, 8);
                    console.log("Generated Peer ID:", randomId);
                    
                    try {
                        peer = new Peer(randomId);
                    } catch (err) {
                        console.error('Failed to create Peer instance:', err);
                        document.getElementById('session-info').innerText = 'PeerJS Init Failed. Use Pass & Play.';
                        resolve(false);
                        return;
                    }

                    peer.on('open', (id) => {
                        console.log("Peer connection opened with ID:", id);
                        currentPeerId = id;
                        document.getElementById('session-info').innerText = 'Session ID: ' + id.substring(0, 8) + '...';
                        
                        // Load saved IP from localStorage or auto-detect from hostname
                        let savedIp = safeGetItem('trotters_host_ip', '');
                        const hostname = window.location.hostname;

                        if (savedIp) {
                            document.getElementById('network-ip').value = savedIp;
                        } else if (hostname && hostname !== 'localhost' && hostname !== '127.0.0.1') {
                            document.getElementById('network-ip').value = hostname;
                            safeSetItem('trotters_host_ip', hostname);
                        }

                        // Generate QR code with a small delay to ensure library is ready
                        setTimeout(updateQRCode, 100);
                        
                        // Also update the session info with a more user-friendly message
                        setTimeout(() => {
                            const sessionInfo = document.getElementById('session-info');
                            if (sessionInfo && sessionInfo.innerText.includes('Session ID:')) {
                                sessionInfo.innerText = 'Ready! Scan QR code to connect judge phone.';
                            }
                        }, 500);
                        
                        resolve(true);
                    });

                    peer.on('connection', (connection) => {
                        console.log("New connection received");
                        conn = connection;
                        setupConnection();
                    });

                    peer.on('error', (err) => {
                        console.error('PeerJS error:', err);
                        const sessionInfo = document.getElementById('session-info');
                        if (sessionInfo) {
                            sessionInfo.innerText = 'Offline / PeerJS Error. Use Pass & Play below.';

        function updateQRCode() {
            if (!currentPeerId) {
                console.warn("No PeerID available for QR code generation");
                // Retry after a short delay to allow PeerJS to initialize
                setTimeout(() => {
                    if (currentPeerId) {
                        updateQRCode();
                    }
                }, 300);
                return;
            }

            // Check if QRCode library is available
            if (typeof QRCode === 'undefined') {
                console.warn("QRCode library not yet available, retrying...");
                setTimeout(updateQRCode, 200);
                return;
            }

            let ipInput = document.getElementById('network-ip').value.trim();
            const host = ipInput || window.location.hostname || 'localhost';
            const port = window.location.port ? ':' + window.location.port : '';

            const judgeUrl = baseUrl + window.location.pathname.replace('gibberish-host.html', 'gibberish-judge.html') + '?id=' + currentPeerId;

                    sessionInfo.textContent = `Session ID: ${currentPeerId.substring(0, 8)}...`;

                qrContainer.innerHTML = '<div style="color: #ef4444; font-size: 0.9rem; padding: 1rem; text-align: center;">⚠️ QR Code generation failed<br>Please refresh the page</div>';

        function setupConnection() {
            console.log('Judge connected!');
            // Mark that we're now in a game session
            isInGameSession = true;
            
            // Reset local game score counter to 0 for fresh start
            score = 0;
            
            // Force immediate screen transition - hide setup screen and show game screen
            const setupScreen = document.getElementById('setup-screen');
            const gameScreen = document.getElementById('game-screen');
            const roundBadge = document.getElementById('round-badge');
            
            if (setupScreen) setupScreen.style.display = 'none';
            if (gameScreen) gameScreen.style.display = 'flex';
            if (roundBadge) {
                roundBadge.style.display = 'block';
                roundBadge.innerText = `Round ${roundNumber}`;
            }

            // FORCE SYNCHRONOUS LAYOUT UPDATE - Critical fix for QR code scanning lag
            if (gameScreen) {
                // Force immediate style recalculation and layout flush
                gameScreen.getBoundingClientRect();
                // Force browser to paint immediately
                gameScreen.style.transform = 'translateZ(0)'; // GPU acceleration hint
                // Force reflow to ensure immediate visual update
                gameScreen.offsetHeight;
            }
            
            // Initialize all player scores to 0 for a fresh game session
            initializeZeroScores(true); // Force reset all scores to 0

            // Send current game state immediately upon connection
            sendGameState();

            // Load cards and start game 
            loadCardsAndStart();
            
            // Force immediate comprehensive render with guaranteed synchronous update
            renderAllUIElements();
            
            // Force immediate layout calculation and paint
            if (gameScreen) {
                gameScreen.offsetHeight; // Force reflow
                // Schedule guaranteed repaint
                requestAnimationFrame(() => {
                    renderAllUIElements();
                    gameScreen.offsetHeight; // Force another reflow in next frame
                });
            }

            conn.on('open', () => {
                console.log('Connection opened - sending game state');
                // Send current game state
                sendGameState();
            });

            conn.on('data', (data) => {
                if (data.action === 'correct') {
                    score++;
                    updateScore();
                    const active = getActivePlayer();
                    if (active) adjustScore(active, 1);
                    nextCardData();
                } else if (data.action === 'skip') {
                    nextCardData();
                } else if (data.action === 'RESET_GAME') {
                    advanceTurnToNextPlayer();
                    doReset();
                } else if (data.action === 'TIMER_TICK' || data.type === 'TIMER_TICK') {
                    if (data.timeLeft !== undefined) {
                        timeLeft = data.timeLeft;
                        updateTimerDisplay();
                    }
                }
                
                // Force immediate comprehensive render with synchronous updates
                renderAllUIElements();
                
                // FORCE SYNCHRONOUS RENDERING FOR IMMEDIATE VISUAL FEEDBACK
                const gameScreen = document.getElementById('game-screen');
                if (gameScreen) {
                    // Force immediate style recalculation
                    gameScreen.getBoundingClientRect();
                    // Force browser paint
                    gameScreen.offsetHeight;
                }
                
                // Schedule next frame update
                requestAnimationFrame(() => {
                    renderAllUIElements();
                    // Force layout flush in next frame
                    if (gameScreen) gameScreen.offsetHeight;
                });
            });

            // Handle connection close/disconnect
            conn.on('close', () => {
                console.log('Judge disconnected');
                isInGameSession = false;
                // Optionally show a message or revert to setup screen
            });

            // Handle connection errors
            conn.on('error', (err) => {
                console.error('Connection error:', err);
                isInGameSession = false;
            });
        }

        function renderAllUIElements() {
            // Update all UI elements in a single consistent pass
            updateScore();

        // Removed duplicate state block


        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Removed duplicate declarations that were causing errors and conflicting with the global state defined at the top.
        // The variables are already declared in the global scope (lines 197-205).
        
        // Fetch cards and initialize if empty
        fetch('./gibberish-cards.json')
            .then(res => res.json())
            .then(data => {
                // Use the global allCards variable directly
                if (allCards.length === 0) {
                    allCards = shuffle(data);
                    const cardsJson = safeStringifyJSON(allCards);
                    if (cardsJson) {
                        safeSetItem('gibberish_cards', cardsJson);
                    }
                }
                console.log('Cards loaded');
            })
            .catch(err => console.error('Failed to load cards:', err));

        function startNewRound() {
            score = 0;
            updateScore();
            startTimer();
            showCurrentCard();
        }

        function loadCardsAndStart() {
            startNewRound();
        }

        function showCurrentCard() {
            if (allCards.length === 0) return;
            
            if (currentIndex >= allCards.length) {
                allCards = shuffle(allCards);
                currentIndex = 0;
                const cardsJson = safeStringifyJSON(allCards);
                if (cardsJson) {
                    safeSetItem('gibberish_cards', cardsJson);
                }
            }
            safeSetItem('gibberish_index', currentIndex.toString());
            
            const card = allCards[currentIndex];

            
            // Fallback safety to grab text regardless of JSON property names
            const phraseText = card.gibberish || card.phrase || card.text || card.question || 'Loading...';
            const categoryText = card.category || card.genre || 'Gibberish Party';
            const hintText = card.hint || card.clue || card.translation || 'No hint available';

            // Update host display elements immediately
            const phraseEl = document.getElementById('phrase-val');
            const categoryEl = document.getElementById('category-val');
            const scoreEl = document.getElementById('score-val');
            
            if (phraseEl) phraseEl.innerText = phraseText;
            if (categoryEl) categoryEl.innerText = categoryText;
            if (scoreEl) scoreEl.innerText = score !== undefined ? score : '0';

            // Sync to judge with valid non-undefined fields
            if (conn && conn.open) {
                conn.send({
                    type: 'STATE_UPDATE',
                    gibberish: phraseText,
                    category: categoryText,
                    answer: card.answer || 'N/A',
                    hint: hintText,
                    score: score !== undefined ? score : 0,
                    timeLeft: timeLeft,
                    isTickUpdate: false,
                    revealed: false,
                    isGameOver: false
                });
            }
            
            // Also update timer display
            updateTimerDisplay();
        }

        // Removed local duplicate declarations below.



        function startTimer() {
            if (gameRunning) return; // Don't reset if already running
            gameRunning = true;
            timeLeft = 60;
            updateTimerDisplay();
            // Clear any existing interval first
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    gameRunning = false;
                    handleTimeout();
                } else {
                    syncState();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timer-val');
            if (el) {
                el.innerText = timeLeft + 's';
            }
        }

        function handleTimeout() {
            const el = document.getElementById('phrase-val');
            if (el) {
                el.innerText = 'TIME IS UP!';
            }
            
            // UI cleanup for host
            const gameControls = document.getElementById('game-controls');
            if (gameControls) gameControls.style.display = 'none';
            const phraseVal = document.getElementById('phrase-val');
            if (phraseVal) phraseVal.style.display = 'block';

            const playAgainBtn = document.getElementById('play-again-btn');
            if (playAgainBtn) playAgainBtn.style.display = 'block';

            if (conn && conn.open) {
                conn.send({ type: 'TIMEOUT' });
            }
            
            // Stop the timer
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            gameRunning = false;
        }

        function sendGameState() {
            if (conn && conn.open && allCards.length > 0) {
                const card = allCards[currentIndex] || allCards[0];
                if (card) {
                    const phraseText = card.gibberish || card.phrase || card.text || card.question || 'Loading...';
                    const categoryText = card.category || card.genre || 'Gibberish Party';
                    const hintText = card.hint || card.clue || card.translation || 'No hint available';
                    
                    try {
                        conn.send({
                            type: 'STATE_UPDATE',
                            gibberish: phraseText,
                            category: categoryText,
                            answer: card.answer || 'N/A',
                            hint: hintText,
                            score: score !== undefined ? score : 0,
                            timeLeft: timeLeft,
                            isTickUpdate: false,
                            revealed: false,
                            isGameOver: false
                        });
                        console.log('Game state sent successfully');
                    } catch (err) {
                        console.error('Failed to send game state:', err);
                    }
                }
            }
        }

        function syncState() {
            if (conn && conn.open) {
                try {
                    conn.send({
                        type: 'STATE_UPDATE',
                        isTickUpdate: true,
                        timeLeft: timeLeft
                    });
                } catch (err) {
                    console.error('Failed to sync state:', err);
                }
            }
            // Also update the host display immediately
            updateTimerDisplay();
            updateScore();
        }

        function resetGame() {
            advanceTurnToNextPlayer();
            if (conn && conn.open) {
                conn.send({ type: 'RESET_GAME' });
            }
            doReset();
        }

        function advanceTurnToNextPlayer() {
            try {
                const players = getPlayers();
                if (!players || players.length === 0) return;
                
                const current = getActivePlayer();
                let nextPlayer = players[0]; // default wrap to first
                
                if (current) {
                    const currentIdx = players.indexOf(current);
                    if (currentIdx !== -1) {
                        const nextIdx = (currentIdx + 1) % players.length;
                        nextPlayer = players[nextIdx];
                        
                        // Check if we're wrapping back to the first player (completed a full cycle)
                        if (nextIdx === 0 && players.length > 1) {
                            roundNumber++;
                            updateRoundBadge(); // Update round badge immediately when round changes
                        }
                    }
                } else if (players.length > 0) {
                    // If no current player was set, start with first player
                    nextPlayer = players[0];
                }
                
                safeSetItem(ACTIVE_PLAYER_KEY, nextPlayer);
                renderTapOrderSelector();
                renderScoreboard();
            } catch (e) {
                console.error("Failed to advance turn order", e);
            }
        }

        function updateRoundBadge() {
            // Update round badge immediately when round changes
            const roundBadge = document.getElementById('round-badge');
            if (roundBadge) {
                roundBadge.innerText = `Round ${roundNumber}`;
            }
            // Save round number to localStorage
            safeSetItem('gibberish_round_number', roundNumber.toString());
        }

        function getNextPlayerName() {
            try {
                const players = getPlayers();
                if (!players || players.length === 0) return 'None';
                if (players.length === 1) return players[0];

                const current = getActivePlayer();
                if (!current) return players[0];

                const currentIdx = players.indexOf(current);
                if (currentIdx === -1) return players[0];

                const nextIdx = (currentIdx + 1) % players.length;
                return players[nextIdx];
            } catch (e) {
                return 'None';
            }
        }

        function doReset() {
            score = 0;
            updateScore();
            const phraseEl = document.getElementById('phrase-val');
            if (phraseEl) phraseEl.innerText = 'Ready?';
            const playAgainBtn = document.getElementById('play-again-btn');
            if (playAgainBtn) playAgainBtn.style.display = 'none';
            const gameControls = document.getElementById('game-controls');
            if (gameControls) gameControls.style.display = 'flex';

            // Clear interval to prevent multiple timers if multiple resets happen
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            gameRunning = false;
            
            // Reset for new game - start at beginning 
            currentIndex = 0;
            // Note: roundNumber is managed by advanceTurnToNextPlayer()
            updateRoundBadge(); // Update round badge to show current round
            
            if (currentIndex >= allCards.length) {
                allCards = shuffle(allCards);
                currentIndex = 0;
                const cardsJson = safeStringifyJSON(allCards);
                if (cardsJson) {
                    safeSetItem('gibberish_cards', cardsJson);
                }
            }
            safeSetItem('gibberish_index', currentIndex.toString());
            
            // Preserve existing scores - don't reset to zero
            renderScoreboard();
            
            // Force immediate comprehensive render using requestAnimationFrame
            requestAnimationFrame(() => {
                // Trigger comprehensive UI update in a single pass
                renderAllUIElements();
                
                // Force layout read to ensure immediate repaint
                const gameContainer = document.querySelector('.game-container');
                if (gameContainer) gameContainer.offsetHeight;
            });
            
            loadCardsAndStart();
        }

        function renderTapOrderSelector() {
            const grid = document.getElementById('order-selector-grid');
            if (!grid) {
                console.warn("Tap order grid container not found");
                return;
            }
            
            console.log("Rendering tap order selector");

            const slots = getPlayerSlots();
            const activePlayer = getActivePlayer();

            // Always clear the grid to ensure fresh render
            grid.innerHTML = '';
            
            ALL_SLOT_PLAYERS.forEach((defaultSlotName, idx) => {
                const color = COLORS[idx % COLORS.length];
                const icon = ICONS[idx % ICONS.length];
                
                const orderIdx = slots.findIndex(s => s.slotIndex === idx);
                const isSelected = orderIdx !== -1;
                const isFirst = orderIdx === 0;
                const assignedNum = orderIdx !== -1 ? (orderIdx + 1) : null;
                const labelText = isSelected ? `Player ${assignedNum}` : `Player ${idx + 1}`;

                const wrap = document.createElement('div');
                wrap.className = `order-token-wrap ${isSelected ? 'active' : ''} ${isFirst ? 'first-active' : ''}`;
                wrap.title = isSelected ? `${labelText}: Turn #${assignedNum} (Tap to remove)` : `Tap to select as Player ${slots.length + 1}`;
                wrap.onclick = () => togglePlayerSlot(idx);

                let badgeHtml = '';
                if (isSelected) {
                    badgeHtml = `<span class="order-badge" style="${isFirst ? 'background: var(--correct-color);' : 'background:' + color + ';'}">${assignedNum}</span>`;
                }

                wrap.innerHTML = `
                    <div class="order-token-btn" style="border-color: ${isSelected ? color : 'transparent'};">
                        ${badgeHtml}
                        <span>${icon}</span>
                    </div>
                    <span class="order-label">${labelText}</span>
                `;

                grid.appendChild(wrap);
            });
            
            console.log("Player icons rendered, slots:", slots ? slots.length : 0);
        }

        // Ensure tap order selector is rendered on DOM load
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOM loaded - initializing tap order selector");
            setTimeout(renderTapOrderSelector, 50);
        });

        function togglePlayerSlot(slotIdx) {
            try {
                let slots = getPlayerSlots();
                const existingIdx = slots.findIndex(s => s.slotIndex === slotIdx);

                if (existingIdx !== -1) {
                    slots.splice(existingIdx, 1);
                } else {
                    slots.push({ slotIndex: slotIdx });
                }

                slots.forEach((s, i) => {
                    s.name = `Player ${i + 1}`;
                });

                savePlayerSlots(slots);

                if (slots.length > 0) {
                    safeSetItem(ACTIVE_PLAYER_KEY, slots[0].name);
                } else {
                    safeRemoveItem(ACTIVE_PLAYER_KEY);
                }

                const scores = getScores();
                slots.forEach(s => {
                    if (scores[s.name] === undefined) scores[s.name] = 0;
                });
                const scoresJson = safeStringifyJSON(scores);
                if (scoresJson) {
                    safeSetItem(SCOREBOARD_KEY, scoresJson);
                }

                renderTapOrderSelector();
                renderScoreboard();
            } catch (e) {
                console.error("Failed to toggle player tap order", e);
            }
        }

        function clearTapOrder() {
            try {
                // Clear in-memory fallback
                fallbackPlayerSlots = [];
                
                const emptyArrayJson = safeStringifyJSON([]);
                if (emptyArrayJson) {
                    safeSetItem('gibberish_player_slots', emptyArrayJson);
                    safeSetItem(PLAYERS_KEY, emptyArrayJson);
                }
                safeRemoveItem(ACTIVE_PLAYER_KEY);
                renderTapOrderSelector();
                renderScoreboard();
            } catch (e) {
                console.error("Failed to clear tap order", e);
            }
        }

        function getPlayerSlots() {
            const raw = safeGetItem('gibberish_player_slots');
            const parsed = safeParseJSON(raw, []);
            // If we got valid data from localStorage, use it and update fallback
            if (parsed !== null && Array.isArray(parsed) && parsed.length > 0) {
                fallbackPlayerSlots = parsed;
                return parsed;
            }
            // If localStorage failed but we have fallback data, use that
            if (fallbackPlayerSlots.length > 0) {
                return fallbackPlayerSlots;
            }
            // Otherwise return empty array
            return [];
        }

        function savePlayerSlots(slots) {
            // Always update in-memory fallback
            fallbackPlayerSlots = slots;
            
            // Try to save to localStorage
            const slotsJson = safeStringifyJSON(slots);
            if (slotsJson) {
                const localStorageSuccess = safeSetItem('gibberish_player_slots', slotsJson);
                // If localStorage fails, the in-memory fallback will be used
                if (!localStorageSuccess) {
                    console.warn('localStorage save failed, using in-memory fallback');
                }
            }
            
            // Also save player names array
            const names = slots.map(s => s.name);
            const namesJson = safeStringifyJSON(names);
            if (namesJson) {
                safeSetItem(PLAYERS_KEY, namesJson);
            }
        }

        function getPlayers() {
            try {
                const slots = getPlayerSlots();
                return slots.map(s => s.name);
            } catch (e) {
                return [];
            }
        }

        function getScores() {
            const raw = safeGetItem(SCOREBOARD_KEY);
            return safeParseJSON(raw, {});
        }

        function initializeZeroScores(forceReset = false) {
            try {
                const players = getPlayers();
                let scores = getScores();
                let changed = false;
                
                if (forceReset) {
                    // Reset all selected players' scores to 0
                    players.forEach(player => {
                        scores[player] = 0;
                        changed = true;
                    });
                } else {
                    // Only initialize scores for players that don't already have scores
                    players.forEach(player => {
                        if (scores[player] === undefined) {
                            scores[player] = 0;
                            changed = true;
                        }
                    });
                }
                
                if (changed) {
                    const scoresJson = safeStringifyJSON(scores);
                    if (scoresJson) {
                        safeSetItem(SCOREBOARD_KEY, scoresJson);
                    }
                }
                
                // Don't reset the local score counter here unless forceReset
                return scores;
            } catch (e) {
                console.error("Failed to initialize zero scores", e);
                return {};
            }
        }

        function getActivePlayer() {
            return safeGetItem(ACTIVE_PLAYER_KEY, null);
        }

        function setActivePlayer(playerName) {
            try {
                const current = getActivePlayer();
                if (current === playerName) {
                    safeRemoveItem(ACTIVE_PLAYER_KEY);
                } else {
                    safeSetItem(ACTIVE_PLAYER_KEY, playerName);
                }
                renderTapOrderSelector();
                renderScoreboard();
            } catch (e) {
                console.error("Failed to set active player", e);
            }
        }

        function adjustScore(playerName, delta) {
            try {
                const scores = getScores();
                scores[playerName] = (scores[playerName] || 0) + delta;
                const scoresJson = safeStringifyJSON(scores);
                if (scoresJson) {
                    safeSetItem(SCOREBOARD_KEY, scoresJson);
                }
                renderScoreboard();
            } catch (e) {
                console.error("Failed to save score", e);
            }
        }

        function resetScores() {
            try {
                safeRemoveItem(SCOREBOARD_KEY);
                safeRemoveItem(PLAYERS_KEY);
                safeRemoveItem('gibberish_player_slots');
                safeRemoveItem(ACTIVE_PLAYER_KEY);
                // Clear in-memory fallback
                fallbackPlayerSlots = [];
                renderTapOrderSelector();
                renderScoreboard();
            } catch (e) {
                console.error("Failed to reset scores", e);
            }
        }

        function renderScoreboard() {
            const list = document.getElementById('players-list');
            if (!list) return;
            const players = getPlayers();
            const scores = getScores();
            const activePlayer = getActivePlayer();
            const slots = getPlayerSlots(); // Get actual slots to preserve selected icons

            if (players.length === 0) {
                list.innerHTML = '<div style="font-size: 0.9rem; color: var(--text-muted); padding: 0.5rem 0; text-align: center;">No players selected in Play Order.</div>';
                return;
            }

            list.innerHTML = '';
            players.forEach((p, idx) => {
                const isSelected = (p === activePlayer);
                const color = COLORS[idx % COLORS.length];
                
                // Get the actual icon from the selected slot, not the default ICONS array
                let icon = '👤'; // Default fallback
                const slot = slots.find(s => s.name === p);
                if (slot && slot.slotIndex !== undefined) {
                    icon = ICONS[slot.slotIndex % ICONS.length];
                } else {
                    // Fallback to index-based icon if slot not found
                    icon = ICONS[idx % ICONS.length];
                }

                const div = document.createElement('div');
                div.className = `score-token-row ${isSelected ? 'active' : ''}`;
                div.title = isSelected ? `${p}: Currently active (click to deselect)` : `${p}: Click to make active`;
                div.onclick = () => setActivePlayer(p);

                div.innerHTML = `
                    <div class="score-token-btn" style="border-color: ${isSelected ? color : 'transparent'};">
                        <span class="score-token-badge" style="background: ${isSelected ? 'var(--correct-color)' : color};">${idx + 1}</span>
                        <span>${icon}</span>
                    </div>
                    <div class="score-token-info">
                        <div class="score-token-name">${p} ${isSelected ? '<span style="color: #60a5fa; font-size: 0.8rem;">★ ACTIVE</span>' : ''}</div>
                    </div>
                    <div class="score-token-val" id="player-score-${idx}">${scores[p] || 0}</div>
                `;
                list.appendChild(div);
            });

            // Update Up Next indicator banner
            const upNextEl = document.getElementById('up-next-player');
            if (upNextEl) {
                upNextEl.innerText = getNextPlayerName();
            }
        }

        function exitToGameHub(e) {
            if (e) e.preventDefault();
            try {
                // Reset all player scores to 0 when exiting to game hub
                const players = getPlayers();
                if (players.length > 0) {
                    let scores = {};
                    players.forEach(player => {
                        scores[player] = 0;
                    });
                    const scoresJson = safeStringifyJSON(scores);
                    if (scoresJson) {
                        safeSetItem(SCOREBOARD_KEY, scoresJson);
                    }
                }
                
                // Clear saved selected players and active player from storage and memory
                safeRemoveItem('gibberish_player_slots');
                safeRemoveItem(PLAYERS_KEY);
                safeRemoveItem(ACTIVE_PLAYER_KEY);
                try {
                    sessionStorage.removeItem('gibberish_session_active');
                } catch (e) {
                    console.warn('sessionStorage access blocked:', e);
                }
                safeRemoveItem('gibberish_round_number'); // Clear round number
                
                // Clear in-memory fallback
                fallbackPlayerSlots = [];
                
                // Reset game session flag
                isInGameSession = false;
                
                // Also clear any active timers
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                
                // Clear any peer connections with forced cleanup
                if (conn) {
                    try {
                        conn.close();
                    } catch (err) {
                        console.warn("Failed to close connection", err);
                    }
                    conn = null;
                }
                if (peer) {
                    try {
                        // Force destroy with timeout to ensure cleanup
                        peer.destroy();
                        // Additional cleanup assurance
                        setTimeout(() => {
                            peer = null;
                        }, 100);
                    } catch (err) {
                        console.warn("Failed to destroy peer", err);
                        peer = null;
                    }
                }
                
                // Reset game state variables
                score = 0;
                roundNumber = 1;
                currentIndex = 0;
                gameRunning = false;
                timeLeft = 60;
                
                // Reset UI elements to initial state
                const phraseEl = document.getElementById('phrase-val');
                const scoreEl = document.getElementById('score-val');
                const timerEl = document.getElementById('timer-val');
                
                if (phraseEl) phraseEl.innerText = 'Ready?';
                if (scoreEl) scoreEl.innerText = '0';
                if (timerEl) timerEl.innerText = '60s';
                
                const playAgainBtn = document.getElementById('play-again-btn');
                if (playAgainBtn) playAgainBtn.style.display = 'none';
                const gameControls = document.getElementById('game-controls');
                if (gameControls) gameControls.style.display = 'flex';
                
                // Force immediate comprehensive render using multiple strategies
                renderAllUIElements();
                
                requestAnimationFrame(() => {
                    // Trigger comprehensive UI update in a single pass
                    renderAllUIElements();
                    
                    // Force layout read to ensure immediate repaint
                    const gameContainer = document.querySelector('.game-container');
                    if (gameContainer) gameContainer.offsetHeight;
                });
                
                // Additional forced render to bypass browser optimization
                setTimeout(() => {
                    renderAllUIElements();
                    renderScoreboard();
                    
                    // Hide game screen and show setup screen with synchronous updates
                    const setupScreen = document.getElementById('setup-screen');
                    const gameScreen = document.getElementById('game-screen');
                    const roundBadge = document.getElementById('round-badge');
                    
                    if (gameScreen) gameScreen.style.display = 'none';
                    if (setupScreen) setupScreen.style.display = 'block';
                    if (roundBadge) roundBadge.style.display = 'none';
                    
                    // FORCE SYNCHRONOUS LAYOUT UPDATE FOR IMMEDIATE SCREEN TRANSITION
                    if (setupScreen) {
                        // Force immediate style recalculation and layout flush
                        setupScreen.getBoundingClientRect();
                        // Force browser to paint immediately
                        setupScreen.style.transform = 'translateZ(0)'; // GPU acceleration hint
                        // Force reflow to ensure immediate visual update
                        setupScreen.offsetHeight;
                    }
                }, 10);
                
                // Immediately render scoreboard to show reset scores
                renderScoreboard();
                
            } catch (err) {
                console.error("Failed to clear session data on exit", err);
            }
            // Ensure navigation happens even if there are errors
            setTimeout(() => {
                window.location.href = '../game-hub.html';
            }, 100);
        }


        function nextCard(action) {
            if (action === 'correct') {
                score++;
                const active = getActivePlayer();
                if (active) adjustScore(active, 1);
            }
            updateScore();
            currentIndex++;
            
            // Note: Round progression is handled by advanceTurnToNextPlayer() when resetting
            // This function just advances to the next card, not necessarily the next player turn
            
            showCurrentCard();
        }

        function nextCardData() {
            currentIndex++;
            showCurrentCard();
        }

        function updateScore() {
            const el = document.getElementById('score-val');
            if (el) {
                el.innerText = score;
            }
        }

        function startPassAndPlay() {
            // Mark that we're now in a game session
            isInGameSession = true;
            
            // Reset local game score counter to 0 for fresh start
            score = 0;
            
            const setupScreen = document.getElementById('setup-screen');
            const gameScreen = document.getElementById('game-screen');
            const roundBadge = document.getElementById('round-badge');
            
            if (setupScreen) setupScreen.style.display = 'none';
            if (gameScreen) gameScreen.style.display = 'flex';
            if (roundBadge) {
                roundBadge.style.display = 'block';
                roundBadge.innerText = `Round ${roundNumber}`;
            }
            
            // FORCE SYNCHRONOUS LAYOUT UPDATE - Consistent with QR code connection
            if (gameScreen) {
                // Force immediate style recalculation and layout flush
                gameScreen.getBoundingClientRect();
                // Force browser to paint immediately
                gameScreen.style.transform = 'translateZ(0)'; // GPU acceleration hint
                // Force reflow to ensure immediate visual update
                gameScreen.offsetHeight;
            }
            
            // Initialize all player scores to 0 for a fresh game session
            initializeZeroScores(true); // Force reset all scores to 0
            renderScoreboard(); // Immediately render scoreboard to show current scores
            
            // Load cards and start game
            loadCardsAndStart();
            
            // Force immediate comprehensive render with guaranteed synchronous update
            renderAllUIElements();
            
            // Force immediate layout calculation and paint
            if (gameScreen) {
                gameScreen.offsetHeight; // Force reflow
                // Schedule guaranteed repaint
                requestAnimationFrame(() => {
                    renderAllUIElements();
                    gameScreen.offsetHeight; // Force another reflow in next frame
                });
            }
        }

        // Run on load
        // Single initialization function to avoid conflicts
        async function initializeApp() {
            console.log("Initializing Gibberish Host App");
            
            // Always clear stale session state on fresh load to ensure clean start
            try {
                sessionStorage.removeItem('gibberish_session_active');
            } catch (e) {
                console.warn('sessionStorage access blocked:', e);
            }
            
            // Clear all stale game state to ensure fresh start
            safeRemoveItem('gibberish_player_slots');
            safeRemoveItem(PLAYERS_KEY);
            safeRemoveItem(ACTIVE_PLAYER_KEY);
            safeRemoveItem('gibberish_round_number');
            safeRemoveItem(SCOREBOARD_KEY); // Clear scoreboard data
            
            // Clear in-memory fallback
            fallbackPlayerSlots = [];
            
            // Reset all game state variables to initial values
            roundNumber = 1;
            score = 0;
            currentIndex = 0;
            gameRunning = false;
            timeLeft = 60;
            isInGameSession = false;
            
            // Ensure proper initial screen states
            const setupScreen = document.getElementById('setup-screen');
            const gameScreen = document.getElementById('game-screen');
            
            if (setupScreen) {
                setupScreen.style.display = 'block';
                console.log('Setup screen displayed');
            } else {
                console.warn('Setup screen element not found');
            }
            
            // Always hide game screen on fresh load
            if (gameScreen) {
                gameScreen.style.display = 'none';
                console.log('Game screen hidden');
            }
            
            // Reset UI to initial state
            const phraseEl = document.getElementById('phrase-val');
            const scoreEl = document.getElementById('score-val');
            const timerEl = document.getElementById('timer-val');
            
            if (phraseEl) phraseEl.innerText = 'Ready?';
            if (scoreEl) scoreEl.innerText = '0';
            if (timerEl) timerEl.innerText = '60s';
            
            const playAgainBtn = document.getElementById('play-again-btn');
            if (playAgainBtn) playAgainBtn.style.display = 'none';
            const gameControls = document.getElementById('game-controls');
            if (gameControls) gameControls.style.display = 'flex';
            
            // Hide round badge
            const roundBadge = document.getElementById('round-badge');
            if (roundBadge) {
                roundBadge.style.display = 'none';
            }
            
            // Force DOM refresh
            if (phraseEl) phraseEl.offsetHeight;
            if (scoreEl) scoreEl.offsetHeight;
            if (timerEl) timerEl.offsetHeight;
            
            // Clear any existing timers/intervals
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            
            // Destroy any existing PeerJS connections with proper async cleanup
            if (conn) {
                try {
                    conn.close();
                } catch (err) {
                    console.warn("Failed to close existing connection", err);
                }
                conn = null;
            }
            if (peer) {
                try {
                    peer.destroy();
                } catch (err) {
                    console.warn("Failed to destroy existing peer", err);
                }
                peer = null;
            }
            
            // Mark this as a fresh session
            try {
                sessionStorage.setItem('gibberish_session_active', '1');
            } catch (e) {
                console.warn('sessionStorage access blocked:', e);
            }
            
            // Initialize fresh PeerJS connection with await
            await initPeer();
            
            // Render fresh tap order selector and scoreboard
            renderTapOrderSelector();
            renderScoreboard();
            
            // Ensure QR code is generated on load
            setTimeout(updateQRCode, 150);
            
            console.log('Page initialization complete - fresh session started');
        }
        
        // Single initialization trigger
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOM content loaded - initializing app");
            initializeApp().catch(err => {
                console.error("Failed to initialize app:", err);
            });
        });
    </script>
</body>
