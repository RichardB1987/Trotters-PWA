<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Bingo - Player Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="quiz-bingo-theme.css">
    <style>
        /* Marquee Lights theme: category/tile colours, fonts and the sunburst backdrop live in
           quiz-bingo-theme.css (shared with quiz-bingo.html). Layout geometry below is unchanged. */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: var(--font-body);
            color: var(--ink);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px 12px;
            position: relative;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            z-index: 1;
        }

        .card-panel {
            background: var(--stout);
            border: 4px solid var(--ink);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 13px;
            box-shadow: var(--shadow-hard-lg);
        }

        .game-title {
            font-family: var(--font-display);
            font-size: clamp(1.4rem, 5vw, 1.85rem);
            font-weight: 400;
            color: var(--lamp);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.1;
            text-shadow: 3px 3px 0 var(--ink);
        }

        #bingoBanner {
            display: none;
            background: var(--lamp);
            color: var(--ink);
            font-family: var(--font-display);
            font-size: 1.3rem;
            padding: 8px 12px;
            border: 3px solid var(--ink);
            border-radius: 12px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: var(--shadow-hard);
        }
        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
            aspect-ratio: 1 / 1;
        }

        /* Tile fill colours (.t-blue ... .t-green) come from quiz-bingo-theme.css */
        .bingo-tile {
            position: relative;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--ink);
            overflow: hidden;
            box-shadow: 2px 2px 0 var(--ink);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            user-select: none;
        }

        .bingo-tile:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0 var(--ink);
        }

        .bingo-tile:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 var(--ink);
        }

        /* Soft top highlight so each tile reads like a printed game-board square */
        .bingo-tile::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0) 45%);
            pointer-events: none;
        }

        .mark-x {
            position: relative;
            z-index: 2;
            font-family: var(--font-display);
            font-size: clamp(1.3rem, 4.5vw, 1.85rem);
            color: #ffffff;
            opacity: 0;
            transition: opacity 0.18s ease;
            text-shadow: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink);
            pointer-events: none;
        }

        .bingo-tile.marked .mark-x {
            opacity: 1;
        }

        .bingo-tile.winning-line {
            border: 3px solid var(--lamp);
            outline: 3px solid var(--ink);
            outline-offset: -1px;
            box-shadow: 0 0 0 2px var(--ink), 0 0 14px var(--lamp);
        }


        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .guess-input {
            display: block;
            width: 100%;
            min-height: 64px;
            background: var(--paper);
            border: 3px solid var(--ink);
            border-radius: 14px;
            padding: 12px 16px;
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 1.85rem;
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: 0;
            outline: none;
            box-shadow: inset 2px 2px 0 rgba(17, 17, 17, 0.18), var(--shadow-hard);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            /* Multi-line: wrap long answers onto new lines and never scroll sideways */
            white-space: pre-wrap;
            overflow-wrap: break-word;
            word-break: break-word;
            overflow-x: hidden;
            overflow-y: auto;
            resize: vertical;
        }

        .guess-input::placeholder {
            color: rgba(17, 17, 17, 0.45);
            font-size: 1.35rem;
            font-weight: 800;
        }

        .guess-input:focus {
            background: #ffffff;
            border-color: var(--ink);
            box-shadow: inset 2px 2px 0 rgba(17, 17, 17, 0.18), 0 0 0 4px var(--lamp), var(--shadow-hard);
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            min-height: 46px;
            font-family: var(--font-display);
            font-size: 0.78rem;
            line-height: 1.15;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 3px solid var(--ink);
            border-radius: 999px;
            cursor: pointer;
            padding: 9px 12px;
            color: var(--ink);
            box-shadow: var(--shadow-hard);
            transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.15s ease;
        }

        button:hover {
            transform: translate(-1px, -1px);
            box-shadow: 5px 5px 0 var(--ink);
            filter: brightness(1.05);
        }

        button:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0 var(--ink);
        }

        .btn-clear {
            background: var(--paper);
        }

        .btn-new-card {
            background: var(--lamp);
        }

        @media (max-width: 480px) {
            body {
                justify-content: center;
                padding: 12px 10px;
            }

            .card-panel {
                padding: 14px;
                gap: 11px;
                border-radius: 16px;
            }

            .bingo-grid {
                gap: 5px;
            }

            .guess-input {
                min-height: 66px;
                font-size: 1.95rem;
                padding: 10px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card-panel">
            <h1 class="game-title">Quiz Bingo</h1>
            <div id="bingoBanner">BINGO!</div>
            <div id="bingoGrid" class="bingo-grid"></div>
            <div class="controls">
                <textarea id="guessInput" class="guess-input" rows="2" placeholder="Your guess..." autocomplete="off" spellcheck="false"></textarea>
                <div class="btn-row">
                    <button type="button" class="btn-clear" onclick="clearText()">CLEAR TEXT</button>
                    <button type="button" class="btn-new-card" onclick="newCard()">NEW CARD</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const COLORS = ['t-blue', 't-purple', 't-pink', 't-amber', 't-green'];
        const STORAGE_KEY = 'quiz_bingo_card_state';

        let cardState = {
            tiles: [],
            marked: Array(25).fill(false),
            text: ''
        };

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed.tiles) && parsed.tiles.length === 25) {
                        cardState = {
                            tiles: parsed.tiles,
                            marked: Array.isArray(parsed.marked) && parsed.marked.length === 25
                                ? parsed.marked.map(Boolean)
                                : Array(25).fill(false),
                            text: typeof parsed.text === 'string' ? parsed.text : ''
                        };
                        document.getElementById('guessInput').value = cardState.text;
                        renderGrid();
                        checkBingo();
                        return;
                    }
                }
            } catch (e) {
                console.warn('localStorage access blocked:', e);
            }

            generateNewCard();
        }

        function saveState() {
            cardState.text = document.getElementById('guessInput').value;
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(cardState));
            } catch (e) {
                console.warn('localStorage access blocked:', e);
            }
        }

        function generateNewCard() {
            const pool = [];
            COLORS.forEach((colorClass) => {
                for (let i = 0; i < 5; i++) {
                    pool.push(colorClass);
                }
            });

            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            cardState = {
                tiles: pool,
                marked: Array(25).fill(false),
                text: ''
            };

            document.getElementById('guessInput').value = '';
            saveState();
            renderGrid();
            checkBingo();
        }

        function newCard() {
            generateNewCard();
        }

        function clearText() {
            document.getElementById('guessInput').value = '';
            saveState();
        }

        function toggleTile(index) {
            cardState.marked[index] = !cardState.marked[index];
            saveState();
            renderGrid();
            checkBingo();
        }

        function getWinningIndices() {
            const marked = cardState.marked;
            const winning = new Set();
            const lines = [];

            for (let r = 0; r < 5; r++) {
                lines.push([r * 5, r * 5 + 1, r * 5 + 2, r * 5 + 3, r * 5 + 4]);
            }
            for (let c = 0; c < 5; c++) {
                lines.push([c, c + 5, c + 10, c + 15, c + 20]);
            }
            lines.push([0, 6, 12, 18, 24]);
            lines.push([4, 8, 12, 16, 20]);

            lines.forEach((line) => {
                if (line.every((idx) => marked[idx])) {
                    line.forEach((idx) => winning.add(idx));
                }
            });

            return winning;
        }

        function renderGrid() {
            const grid = document.getElementById('bingoGrid');
            grid.innerHTML = '';
            const winningIndices = getWinningIndices();

            cardState.tiles.forEach((colorClass, index) => {
                const tile = document.createElement('div');
                tile.className = `bingo-tile ${colorClass}`;
                if (cardState.marked[index]) {
                    tile.classList.add('marked');
                }
                if (winningIndices.has(index)) {
                    tile.classList.add('winning-line');
                }

                const mark = document.createElement('div');
                mark.className = 'mark-x';
                mark.textContent = 'X';
                tile.appendChild(mark);

                tile.addEventListener('click', () => toggleTile(index));
                grid.appendChild(tile);
            });
        }

        function checkBingo() {
            const winningIndices = getWinningIndices();
            const banner = document.getElementById('bingoBanner');
            const allMarked = cardState.marked.length === 25 && cardState.marked.every(Boolean);

            if (allMarked) {
                banner.textContent = 'WINNER!';
                banner.style.display = 'block';
            } else if (winningIndices.size > 0) {
                banner.textContent = 'BINGO!';
                banner.style.display = 'block';
            } else {
                banner.textContent = 'BINGO!';
                banner.style.display = 'none';
            }
        }

        document.getElementById('guessInput').addEventListener('input', () => {
            saveState();
        });

        loadState();
    </script>
</body>
</html>
