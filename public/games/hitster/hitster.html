<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitster - Music Card Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0d12;
            --panel: rgba(22, 24, 32, 0.75);
            --text: #f4f1ea;
            --gold: #f5c451;
            --primary: #3b82f6;
            --green: #3ddc97;
            --danger: #e02323;
            --neon-pink: #ec4899;
            --neon-cyan: #06b6d4;
            --neon-purple: #8b5cf6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Rajdhani', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            background-image: linear-gradient(rgba(12, 13, 18, 0.85), rgba(12, 13, 18, 0.92)), url('./neon-vinyl-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle slow-moving ambient neon glow drift layer */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 70% 70%, rgba(236, 72, 153, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 50% 80%, rgba(245, 196, 81, 0.05) 0%, transparent 50%);
            animation: ambientDrift 20s ease infinite alternate;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes ambientDrift {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-3%, 4%) scale(1.05); }
            100% { transform: translate(3%, -3%) scale(1.02); }
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .card {
            background: rgba(22, 24, 32, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid transparent;
            background-image: linear-gradient(rgba(22, 24, 32, 0.75), rgba(22, 24, 32, 0.75)), linear-gradient(135deg, var(--neon-pink), var(--neon-cyan), var(--neon-purple), var(--gold));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border-radius: 20px;
            padding: 35px 24px;
            width: 100%;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(6, 182, 212, 0.15), 0 0 35px rgba(236, 72, 153, 0.15);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card-line {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            line-height: 1.2;
            word-break: break-word;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-cyan), 0 0 30px var(--neon-purple), 0 0 40px var(--gold);
        }
        /* Timer styling */
        .timer-container {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: #f4f1ea;
            letter-spacing: 1.5px;
            margin-top: 4px;
            text-shadow: 0 0 8px rgba(244, 241, 234, 0.4);
        }
        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(22, 24, 32, 0.85);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--gold));
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.6), 0 0 20px rgba(236, 72, 153, 0.4);
            transition: width 0.1s linear;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-top: 8px;
        }
        button, .btn-link {
            min-height: 52px;
            border: 2px solid transparent;
            border-radius: 12px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.25s ease;
            background: rgba(22, 24, 32, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background-image: linear-gradient(rgba(22, 24, 32, 0.75), rgba(22, 24, 32, 0.75)), linear-gradient(135deg, var(--neon-pink), var(--neon-cyan), var(--neon-purple), var(--gold));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            color: #f4f1ea;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(236, 72, 153, 0.3), 0 0 25px rgba(6, 182, 212, 0.2);
            text-shadow: 0 0 8px rgba(244, 241, 234, 0.6);
        }
        button:hover, .btn-link:hover {
            background: rgba(30, 34, 48, 0.85);
            background-image: linear-gradient(rgba(30, 34, 48, 0.85), rgba(30, 34, 48, 0.85)), linear-gradient(135deg, var(--neon-cyan), var(--neon-pink), var(--gold), var(--neon-purple));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7), 0 0 22px rgba(6, 182, 212, 0.6), 0 0 35px rgba(236, 72, 153, 0.5);
            transform: translateY(-2px);
            color: #ffffff;
            text-shadow: 0 0 12px var(--neon-cyan), 0 0 20px var(--neon-pink);
        }
        button:active, .btn-link:active {
            transform: translateY(-1px) scale(0.98);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 10px var(--neon-pink), 0 0 15px var(--neon-cyan);
            filter: brightness(0.95);
        }
        .btn-primary { 
            background: rgba(22, 24, 32, 0.65);
            background-image: linear-gradient(rgba(22, 24, 32, 0.65), rgba(22, 24, 32, 0.65)), linear-gradient(135deg, var(--primary), var(--neon-cyan));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            color: #ffffff; 
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.6), 0 0 15px rgba(59, 130, 246, 0.4);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(59, 130, 246, 0.35), 0 0 25px rgba(6, 182, 212, 0.25);
        }
        .btn-primary:hover {
            background: rgba(30, 34, 48, 0.8);
            background-image: linear-gradient(rgba(30, 34, 48, 0.8), rgba(30, 34, 48, 0.8)), linear-gradient(135deg, var(--neon-cyan), var(--primary));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7), 0 0 22px rgba(59, 130, 246, 0.7), 0 0 35px rgba(6, 182, 212, 0.5);
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.8), 0 0 20px rgba(59, 130, 246, 0.6);
        }
        .btn-full { grid-column: span 2; }
        .btn-gold { 
            background: rgba(22, 24, 32, 0.65);
            background-image: linear-gradient(rgba(22, 24, 32, 0.65), rgba(22, 24, 32, 0.65)), linear-gradient(135deg, var(--gold), var(--neon-pink));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            color: var(--gold); 
            grid-column: span 2; 
            font-weight: 800;
            text-shadow: 0 0 10px rgba(245, 196, 81, 0.6), 0 0 20px rgba(236, 72, 153, 0.4);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 18px rgba(245, 196, 81, 0.4), 0 0 28px rgba(236, 72, 153, 0.3);
        }
        .btn-gold:hover {
            background: rgba(30, 34, 48, 0.8);
            background-image: linear-gradient(rgba(30, 34, 48, 0.8), rgba(30, 34, 48, 0.8)), linear-gradient(135deg, var(--neon-pink), var(--gold));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            color: #ffffff;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7), 0 0 25px rgba(245, 196, 81, 0.7), 0 0 38px rgba(236, 72, 153, 0.5);
            text-shadow: 0 0 12px rgba(245, 196, 81, 0.9), 0 0 22px rgba(236, 72, 153, 0.7);
        }
        .btn-back { 
            background: rgba(22, 24, 32, 0.65);
            background-image: linear-gradient(rgba(22, 24, 32, 0.65), rgba(22, 24, 32, 0.65)), linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            color: white; 
            grid-column: span 2; 
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 12px rgba(255, 255, 255, 0.15);
        }
        .btn-back:hover {
            background: rgba(30, 34, 48, 0.8);
            background-image: linear-gradient(rgba(30, 34, 48, 0.8), rgba(30, 34, 48, 0.8)), linear-gradient(135deg, var(--neon-cyan), rgba(255,255,255,0.3));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7), 0 0 20px rgba(6, 182, 212, 0.5), 0 0 30px rgba(255, 255, 255, 0.25);
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.8), 0 0 20px rgba(255, 255, 255, 0.6);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(12, 13, 18, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }
        .modal-content {
            background: rgba(22, 24, 32, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid transparent;
            background-image: linear-gradient(rgba(22, 24, 32, 0.85), rgba(22, 24, 32, 0.85)), linear-gradient(135deg, var(--neon-pink), var(--neon-cyan), var(--neon-purple), var(--gold));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(236, 72, 153, 0.3), 0 0 40px rgba(6, 182, 212, 0.2);
        }
        .modal-content h2 { 
            font-family: 'Orbitron', sans-serif;
            color: var(--gold); 
            margin-bottom: 20px;
            font-size: 1.6rem;
            text-shadow: 0 0 10px rgba(245, 196, 81, 0.6), 0 0 20px rgba(236, 72, 153, 0.4);
        }
        .years-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 24px;
        }
        .year-badge {
            background: rgba(22, 24, 32, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid transparent;
            background-image: linear-gradient(rgba(22, 24, 32, 0.75), rgba(22, 24, 32, 0.75)), linear-gradient(135deg, var(--gold), var(--neon-pink), var(--neon-cyan));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border-radius: 12px;
            padding: 18px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3), 0 0 15px rgba(245, 196, 81, 0.2);
            text-shadow: 0 0 10px rgba(245, 196, 81, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div id="yearDisplay" class="card-line">Year?</div>
            <div id="songTitle" class="card-line">Song?</div>
            <div id="artistName" class="card-line">Artist/Band?</div>

            <!-- Live Countdown & Progress Bar -->
            <div>
                <div id="timerDisplay" class="timer-container">0:30 / 0:30</div>
                <div class="progress-bar-bg">
                    <div id="progressBar" class="progress-bar-fill"></div>
                </div>
            </div>

            <div class="controls">
                <button class="btn-primary" onclick="togglePlay()">Play / Pause</button>
                <button class="btn-primary" onclick="replayTrack()">Replay</button>
                <button class="btn-primary" onclick="revealCard()">Reveal Card</button>
                <button class="btn-primary" onclick="loadNextTrack()">Next Song</button>
                <button class="btn-primary btn-full" onclick="drawFaceUp()">Draw Face-Up</button>
                <button class="btn-gold" onclick="openStartingYearsModal()">Deal 4 Starting Years</button>
                <a href="/game-hub.html" class="btn-link btn-back">Back to Games Hub</a>
            </div>
        </div>
    </div>

    <!-- Starting Years Modal -->
    <div id="startingYearsModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Starting Years</h2>
            <div id="yearsGrid" class="years-grid"></div>
            <button class="btn-primary" style="width:100%;" onclick="closeStartingYearsModal()">Close</button>
        </div>
    </div>

    <audio id="audioPreview"></audio>

    <script src="js/tracks.js"></script>
    <script>
        let deck = [];
        let currentIndex = 0;
        let currentTrack = null;
        let isRevealed = false;
        const audio = document.getElementById('audioPreview');

        function initGame() {
            deck = [];
            for (const decade in DECADE_SEEDS) {
                const songs = DECADE_SEEDS[decade];
                for (const songInfo of songs) {
                    deck.push({
                        title: songInfo.title,
                        artist: songInfo.artist,
                        year: songInfo.year,
                        previewUrl: '' // No preview URL available without external API
                    });
                }
            }
            deck.sort(() => Math.random() - 0.5);
            if (deck.length > 0) {
                loadTrack(0);
            }
        }

        function cleanString(str) {
            // Remove text inside parentheses/brackets and non-alphanumeric characters
            return str
                .replace(/\s*\(.*?\)\s*/g, '')
                .replace(/\s*\[.*?\]\s*/g, '')
                .replace(/[^a-zA-Z0-9\s]/g, '')
                .trim();
        }

        async function fetchPreviewUrl(track, isRetry = false) {
            return new Promise((resolve) => {
                const cleanTitle = cleanString(track.title);
                const cleanArtist = cleanString(track.artist);
                const term = isRetry ? cleanArtist : `${cleanTitle} ${cleanArtist}`;
                const callbackName = 'itunesCallback_' + Date.now();
                
                window[callbackName] = (data) => {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    if (data.results && data.results.length > 0) {
                        resolve(data.results[0].previewUrl);
                    } else {
                        resolve(null);
                    }
                };

                const script = document.createElement('script');
                script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&limit=1&callback=${callbackName}`;
                script.onerror = () => {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    resolve(null);
                };
                document.body.appendChild(script);
            }).then(async (url) => {
                if (url) return url;
                if (!isRetry) return await fetchPreviewUrl(track, true);
                return await fetchDeezerPreview(track);
            });
        }

        async function fetchDeezerPreview(track) {
            return new Promise((resolve) => {
                const cleanTitle = cleanString(track.title);
                const cleanArtist = cleanString(track.artist);
                const query = `${cleanTitle} ${cleanArtist}`;
                const callbackName = 'deezerCallback_' + Date.now();

                window[callbackName] = (data) => {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    if (data.data && data.data.length > 0) {
                        resolve(data.data[0].preview);
                    } else {
                        resolve(null);
                    }
                };

                const script = document.createElement('script');
                script.src = `https://api.deezer.com/search?q=${encodeURIComponent(query)}&output=jsonp&callback=${callbackName}`;
                script.onerror = () => {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    resolve(null);
                };
                document.body.appendChild(script);
            });
        }

        async function loadTrack(index) {
            if (deck.length === 0) return;
            currentIndex = index % deck.length;
            currentTrack = deck[currentIndex];
            isRevealed = false;

            document.getElementById('yearDisplay').textContent = "Year?";
            document.getElementById('songTitle').textContent = "Loading...";
            document.getElementById('artistName').textContent = "Please wait...";

            const previewUrl = await fetchPreviewUrl(currentTrack);
            
            if (previewUrl) {
                audio.src = previewUrl;
                document.getElementById('songTitle').textContent = "Song?";
                document.getElementById('artistName').textContent = "Artist/Band?";
                audio.pause();
                updateTimerDisplay(0, 30);
            } else {
                audio.src = '';
                document.getElementById('songTitle').textContent = "Preview unavailable";
                document.getElementById('artistName').textContent = currentTrack.artist;
                updateTimerDisplay(0, 30);
            }
        }

        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            const current = audio.currentTime;
            const duration = audio.duration;
            updateTimerDisplay(current, duration);
            
            const progressPercent = (current / duration) * 100;
            document.getElementById('progressBar').style.width = `${progressPercent}%`;
        });

        function updateTimerDisplay(current, duration) {
            const timeLeft = Math.max(0, duration - current);
            const secs = Math.floor(timeLeft % 60).toString().padStart(2, '0');
            const mins = Math.floor(timeLeft / 60);
            const totalSecs = Math.floor(duration % 60).toString().padStart(2, '0');
            const totalMins = Math.floor(duration / 60);
            document.getElementById('timerDisplay').textContent = `${mins}:${secs} / ${totalMins}:${totalSecs} remaining`;
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play().catch(() => {});
            } else {
                audio.pause();
            }
        }

        function replayTrack() {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        }

        function revealCard() {
            if (!currentTrack) return;
            isRevealed = true;
            document.getElementById('yearDisplay').textContent = currentTrack.year;
            document.getElementById('songTitle').textContent = currentTrack.title;
            document.getElementById('artistName').textContent = currentTrack.artist;
            audio.pause();
        }

        function loadNextTrack() {
            loadTrack(currentIndex + 1);
        }

        function drawFaceUp() {
            if (deck.length === 0) return;
            const randomCard = deck[Math.floor(Math.random() * deck.length)];
            currentTrack = randomCard;
            currentIndex = deck.indexOf(randomCard);
            audio.src = currentTrack.previewUrl || '';
            revealCard();
            updateTimerDisplay(0, audio.duration || 30);
        }

        function openStartingYearsModal() {
            const grid = document.getElementById('yearsGrid');
            grid.innerHTML = '';
            
            const years = [];
            while(years.length < 4) {
                const randomYear = Math.floor(Math.random() * (2025 - 1970 + 1)) + 1970;
                if(!years.includes(randomYear)) years.push(randomYear);
            }
            years.sort((a, b) => a - b);

            years.forEach(year => {
                const badge = document.createElement('div');
                badge.className = 'year-badge';
                badge.textContent = year;
                grid.appendChild(badge);
            });

            document.getElementById('startingYearsModal').style.display = 'flex';
        }

        function closeStartingYearsModal() {
            document.getElementById('startingYearsModal').style.display = 'none';
        }

        initGame();
    </script>
</body>
</html>
