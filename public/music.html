<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Hub - Trotters Portal</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        :root {
            --bg-color: #0c0d12;
            --card-bg: #1e222d;
            --card-hover: #262b38;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .top-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
        }

        .back-btn {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .back-btn:hover { color: var(--text-main); }

        h1 {
            font-size: 1.75rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .hub-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 900px;
        }

        .hub-card {
            background-color: var(--card-bg);
            border-radius: 1rem;
            padding: 2rem;
            text-decoration: none;
            color: var(--text-main);
            border: 2px solid var(--border-color);
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hub-card:hover {
            transform: translateY(-4px);
            background-color: var(--card-hover);
            border-color: var(--accent-blue);
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 0.75rem;
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-box svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .hub-card h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .hub-card p {
            margin: 0 0 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.925rem;
            line-height: 1.4;
        }

        .card-footer {
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-btn">&larr; Main Dashboard</a>
        <h1>Music Hub</h1>
        <div style="width: 105px;"></div>
    </div>

    <div class="hub-grid">
        <!-- Live Radio Hub -->
        <a href="radio.html" class="hub-card">
            <div>
                <div class="card-header">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16m-7 6h7"></path><circle cx="7" cy="12" r="2"></circle><circle cx="17" cy="12" r="2"></circle></svg>
                    </div>
                    <h2>Live Radio Hub</h2>
                </div>
                <p>Stream live curated UK stations and custom audio streams seamlessly.</p>
            </div>
            <div class="card-footer">Launch Radio &rarr;</div>
        </a>

        <!-- Jukebox Manager -->
        <a href="jukebox.html" class="hub-card">
            <div>
                <div class="card-header">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24"><path d="M2 4h20v16H2zM6 8h4m-4 4h8m-8 4h6"></path></svg>
                    </div>
                    <h2>Jukebox Manager</h2>
                </div>
                <p>Manage and play local audio files and media tracks.</p>
            </div>
            <div class="card-footer">Launch Jukebox &rarr;</div>
        </a>
    </div>

</body>
</html>
