<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dumb Dumber Dumbest</title>
    <style>
        :root {
            --cream: #fff6dc;
            --cream2: #fde3b8;
            --orange: #ea5a24;
            --orange2: #f7a25a;
            --ink: #5a1f0c;
            --sky: #6bbbe3;
            --sky2: #a9dcf3;
            --pink: #e58ad0;
            --font: "Arial Rounded MT Bold", "Arial Black", Impact, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            font-family: var(--font);
            color: var(--ink);
            background-color: var(--orange);
            background-image:
                radial-gradient(circle, rgba(120, 30, 5, 0.28) 1px, transparent 1.5px),
                radial-gradient(circle, rgba(255, 220, 170, 0.28) 1px, transparent 1.5px);
            background-size: 9px 9px, 13px 13px;
            background-position: 0 0, 4px 6px;
            -webkit-tap-highlight-color: transparent;
        }
        #scallop { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        #burst {
            position: fixed; inset: 24px; z-index: 1; border-radius: 18px; pointer-events: none;
            background:
                radial-gradient(circle, rgba(234, 90, 36, 0.16) 1px, transparent 1.5px) 0 0 / 11px 11px,
                repeating-conic-gradient(from 0deg at 50% 50%, var(--cream) 0 7deg, var(--cream2) 7deg 14deg);
        }
        #app { position: relative; z-index: 2; min-height: 100vh; padding: 38px 40px; }
        .screen[hidden], [hidden] { display: none !important; }
        .back {
            display: inline-block; text-decoration: none; color: var(--cream); background: var(--ink);
            border: 3px solid var(--ink); border-radius: 999px; padding: 0.3rem 0.9rem; font-size: 0.85rem;
            box-shadow: 3px 3px 0 var(--orange);
        }
        .back:hover { background: var(--orange); }
        .title {
            margin: 0.2rem 0 0; text-align: center; text-transform: uppercase; line-height: 0.95;
            font-size: clamp(2rem, min(7vw, 9.5vh), 4.6rem); letter-spacing: -0.01em; color: var(--cream);
            -webkit-text-stroke: 14px var(--orange); paint-order: stroke fill;
            text-shadow: 5px 6px 0 var(--ink);
            transform: rotate(-2deg);
        }
        .title span { display: block; }
        .title span:nth-child(2) { font-size: 1.1em; }
        .title span:nth-child(3) { font-size: 1.2em; }
        .sub { text-align: center; font-size: 1.1rem; margin: 1rem 0 0.4rem; }
        button { font-family: inherit; color: inherit; cursor: pointer; }
        .bigBtn {
            font-size: 1.2rem; text-transform: uppercase; color: var(--cream); background: var(--orange);
            border: 4px solid var(--ink); border-radius: 999px; padding: 0.55rem 1.6rem;
            box-shadow: 4px 5px 0 var(--ink); transition: transform 0.1s, box-shadow 0.1s;
        }
        .bigBtn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 5px 6px 0 var(--ink); }
        .bigBtn:active:not(:disabled) { transform: translate(3px, 4px); box-shadow: 1px 1px 0 var(--ink); }
        .bigBtn:disabled { background: #cdb79b; color: #f3e7d2; cursor: not-allowed; box-shadow: 2px 3px 0 #8b6a55; }
        .bigBtn.blue { background: var(--sky); color: var(--ink); }
        .smallBtn {
            font-size: 0.8rem; text-transform: uppercase; background: var(--cream); border: 3px solid var(--ink);
            border-radius: 999px; padding: 0.3rem 0.8rem; box-shadow: 3px 3px 0 var(--orange);
        }
        .smallBtn:hover { background: var(--sky2); }
        /* Lobby */
        .tokenGrid { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem 1rem; max-width: 1200px; margin: 0.5rem auto 1rem; }
        .pick {
            position: relative; width: clamp(84px, min(20vw, 14vh), 150px); background: none; border: 0; padding: 0;
            transition: transform 0.15s;
        }
        .pick:hover { transform: scale(1.06) rotate(-3deg); }
        .pick svg { width: 100%; height: auto; display: block; filter: drop-shadow(3px 4px 0 rgba(90, 31, 12, 0.35)); }
        .pick.on { transform: scale(1.1); }
        .pick.on::after {
            content: ""; position: absolute; left: -6px; right: -6px; top: -6px; aspect-ratio: 1; border-radius: 50%;
            border: 5px dashed var(--ink); animation: spinSlow 8s linear infinite; pointer-events: none;
        }
        .pick .badge {
            position: absolute; top: -2px; right: -2px; width: 2rem; height: 2rem; line-height: 1.6rem; z-index: 2;
            border-radius: 50%; border: 3px solid var(--ink); background: var(--cream); font-size: 1rem; text-align: center;
        }
        .pick .nm { display: block; text-align: center; font-size: 0.8rem; margin-top: 2px; text-transform: uppercase; }
        @keyframes spinSlow { to { transform: rotate(360deg); } }
        .lobbyBtns { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 1.2rem; margin-top: 0.8rem; }
        .qrBtn {
            display: flex; align-items: center; gap: 0.5rem; background: var(--sky); border: 4px solid var(--ink);
            border-radius: 999px; padding: 0.2rem 1.2rem 0.2rem 0.4rem; font-size: 1rem; text-transform: uppercase;
            box-shadow: 4px 5px 0 var(--ink);
        }
        .qrBtn:hover { background: var(--sky2); }
        .qrBrain svg { width: 52px; height: 52px; display: block; }
        /* Game layout */
        .topBar { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.4rem; }
        .topBtns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .board { --rowH: clamp(36px, 6vh, 56px); display: grid; grid-template-columns: minmax(340px, 33%) minmax(120px, 170px) 1fr; gap: 1rem; align-items: start; }
        /* Red reference scoreboard card: speckled red, scalloped white inner trim */
        .ladderWrap {
            position: relative; border: 4px solid var(--ink); border-radius: 18px; padding: 26px 20px; box-shadow: 5px 6px 0 3px var(--ink);
            background:
                radial-gradient(circle, rgba(255, 255, 255, 0.4) 1px, transparent 1.6px) 0 0 / 23px 29px,
                radial-gradient(circle, rgba(255, 255, 255, 0.28) 1px, transparent 1.5px) 9px 13px / 37px 31px,
                linear-gradient(180deg, #e53925, #df321f);
        }
        .ladderWrap::before {
            content: ""; position: absolute; inset: 4px; pointer-events: none; border-radius: 12px;
            background:
                radial-gradient(circle at 6px 6px, #fff 5.8px, transparent 6.3px) 0 0 / 12px 12px repeat-x,
                linear-gradient(#fff, #fff) 0 6px / 100% 6px no-repeat,
                radial-gradient(circle at 6px 6px, #fff 5.8px, transparent 6.3px) 0 100% / 12px 12px repeat-x,
                linear-gradient(#fff, #fff) 0 calc(100% - 12px) / 100% 6px no-repeat,
                radial-gradient(circle at 6px 6px, #fff 5.8px, transparent 6.3px) 0 0 / 12px 12px repeat-y,
                linear-gradient(#fff, #fff) 6px 0 / 6px 100% no-repeat,
                radial-gradient(circle at 6px 6px, #fff 5.8px, transparent 6.3px) 100% 0 / 12px 12px repeat-y,
                linear-gradient(#fff, #fff) calc(100% - 12px) 0 / 6px 100% no-repeat;
        }
        .ladder { position: relative; height: calc(var(--rowH) * 10); }
        .rung {
            position: absolute; left: 0; right: 0; height: var(--rowH); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px;
            padding: 0 4px; border-bottom: 2px solid rgba(255, 205, 90, 0.75); top: calc(var(--i) * var(--rowH));
        }
        .rung.last { border-bottom-color: transparent; }
        /* 4-point gold sparkles at both ends of each divider */
        .rung::before, .rung::after {
            content: ""; position: absolute; bottom: -6px; width: 11px; height: 11px; background: #ffc928; pointer-events: none;
            clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
        }
        .rung::before { left: -3px; }
        .rung::after { right: -3px; }
        .rung.last::before, .rung.last::after { display: none; }
        .rank {
            display: flex; align-items: center; justify-content: center; width: calc(var(--rowH) * 1.15); height: calc(var(--rowH) - 8px);
            background: var(--cream); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
            font-size: calc(var(--rowH) * 0.34); line-height: 1; color: #fff; -webkit-text-stroke: 4px #e53925; paint-order: stroke fill;
            text-shadow: 1px 2px 0 var(--ink); letter-spacing: 0.02em;
        }
        .rVal {
            display: flex; align-items: baseline; justify-content: flex-start; padding-left: 4px; gap: 0.12em; white-space: nowrap; line-height: 1; color: #fff;
            font-family: "Arial Black", "Arial Rounded MT Bold", Impact, system-ui, sans-serif; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill;
            text-shadow: 2px 3px 0 rgba(0, 0, 0, 0.3);
        }
        .rVal .num { font-size: calc(var(--rowH) * 0.74); letter-spacing: 0.01em; }
        .rVal .iq { font-size: calc(var(--rowH) * 0.34); -webkit-text-stroke-width: 3px; }
        .rIcon {
            position: relative; display: flex; align-items: center; justify-content: center; width: calc(var(--rowH) - 6px); height: calc(var(--rowH) - 6px);
            background: #fff; border: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
        }
        .rIcon svg { width: 90%; height: 90%; display: block; transform-origin: 50% 60%; }
        /* Clever tiers: crisp pop + gold sparkle. Middle: lively bob. Low tiers: slow dazed wobble. */
        .rung.t0 .rIcon svg, .rung.t1 .rIcon svg, .rung.t2 .rIcon svg { animation: smartPop 3.2s ease-in-out infinite; animation-delay: calc(var(--i) * -0.9s); }
        .rung.t0 .rIcon::after, .rung.t1 .rIcon::after, .rung.t2 .rIcon::after {
            content: ""; position: absolute; top: -7px; right: -7px; width: 13px; height: 13px; background: #ffc928; pointer-events: none; opacity: 0;
            clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
            animation: twinkle 3.2s ease-in-out infinite; animation-delay: calc(var(--i) * -0.9s);
        }
        .rung.t3 .rIcon svg, .rung.t4 .rIcon svg, .rung.t5 .rIcon svg { animation: reactBob 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * -0.55s); }
        .rung.t6 .rIcon svg, .rung.t7 .rIcon svg, .rung.t8 .rIcon svg, .rung.t9 .rIcon svg { animation: dazedWobble 4.2s ease-in-out infinite; animation-delay: calc(var(--i) * -0.7s); }
        .rung.t6 { --amp: 4deg; } .rung.t7 { --amp: 5deg; } .rung.t8 { --amp: 7deg; } .rung.t9 { --amp: 9deg; }
        .rung.t8 .rIcon svg, .rung.t9 .rIcon svg { animation-duration: 5.4s; }
        @keyframes smartPop { 0%, 78%, 100% { transform: scale(1) rotate(0); } 84% { transform: scale(1.16) rotate(-4deg); } 90% { transform: scale(0.97) rotate(2deg); } 95% { transform: scale(1.04) rotate(0); } }
        @keyframes twinkle { 0%, 80%, 100% { opacity: 0; transform: scale(0.2) rotate(0); } 86% { opacity: 1; transform: scale(1.1) rotate(45deg); } 94% { opacity: 0; transform: scale(0.4) rotate(90deg); } }
        @keyframes reactBob { 0%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-2px) rotate(-3deg); } 65% { transform: translateY(1px) rotate(3deg); } }
        @keyframes dazedWobble {
            0%, 100% { transform: rotate(0) translate(0, 0) scale(1, 1); }
            25% { transform: rotate(calc(var(--amp, 5deg) * -1)) translate(-1px, 0) scale(1, 0.98); }
            50% { transform: rotate(0) translate(0, 1px) scale(1.03, 0.95); }
            75% { transform: rotate(var(--amp, 5deg)) translate(1px, 0) scale(1, 0.98); }
        }
        @media (prefers-reduced-motion: reduce) { .rIcon svg, .rIcon::after { animation: none !important; } }
        .rTok {
            position: absolute; z-index: 3; width: calc(var(--rowH) * 1.05); height: calc(var(--rowH) * 1.05);
            top: calc(var(--r) * var(--rowH) - var(--rowH) * 0.02); left: var(--x);
            transition: top 0.6s cubic-bezier(0.3, 1.5, 0.5, 1), left 0.3s;
        }
        .rTok svg { width: 100%; height: 100%; display: block; overflow: visible; }
        .rTok .sc {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -20%); min-width: 1.6em; text-align: center;
            font-size: calc(var(--rowH) * 0.34); line-height: 1.1; padding: 0 3px; background: var(--cream);
            border: 2px solid var(--ink); border-radius: 999px;
        }
        /* Timer */
        .timerCol { display: flex; flex-direction: column; align-items: center; justify-content: center; align-self: stretch; gap: 0.5rem; }
        .timer { position: relative; width: 100%; max-width: 180px; aspect-ratio: 1; }
        .timer svg { width: 100%; height: 100%; display: block; }
        .tBack { fill: var(--cream); stroke: var(--ink); stroke-width: 10; }
        .tRing { fill: none; stroke: var(--orange); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 326.7; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
        .timerNum { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: clamp(2.6rem, 6vw, 4.6rem); color: var(--ink); }
        .timer.idle { opacity: 0.55; }
        .timer.run { animation: pulse 1s ease-in-out infinite; }
        .timer.run.low { animation: pulseFast 0.5s ease-in-out infinite; }
        .timer.run.low .tRing { stroke: #d01818; }
        .timer.up { animation: flash 0.6s steps(2) infinite; }
        .timer.up .timerNum { font-size: clamp(1rem, 2.2vw, 1.6rem); text-align: center; color: #d01818; }
        @keyframes pulse { 50% { transform: scale(1.04); } }
        @keyframes pulseFast { 50% { transform: scale(1.12); } }
        @keyframes flash { 50% { transform: scale(1.08); filter: brightness(1.15) hue-rotate(-10deg); } }
        .timerMsg { min-height: 1.2em; font-size: 0.85rem; text-align: center; text-transform: uppercase; }
        /* Q&A */
        .qa { display: flex; flex-direction: column; gap: 0.7rem; min-width: 0; }
        .card { position: relative; border: 5px solid var(--orange); border-radius: 22px; padding: 0.4rem 1rem 0.8rem; box-shadow: 0 0 0 3px var(--ink), 4px 5px 0 3px var(--ink); }
        .qCard { background: var(--sky); min-height: calc(var(--rowH) * 2.4); }
        .aCard { background: var(--cream); min-height: calc(var(--rowH) * 2.8); }
        .cardLabel { text-transform: uppercase; font-size: clamp(1.3rem, 3vh, 2rem); color: var(--cream); -webkit-text-stroke: 7px var(--orange); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); }
        .aCard .cardLabel { -webkit-text-stroke-color: #d01818; }
        .cardText { font-size: clamp(1.2rem, 3.2vh, 2.1rem); line-height: 1.2; color: var(--ink); }
        .aCard .cardText { font-size: clamp(1.6rem, 4.4vh, 3rem); color: #b01010; }
        .qa .bigBtn { align-self: flex-start; }
        .note { min-height: 1.2em; font-size: 0.85rem; }
        /* Bottom players */
        .playerBar { display: flex; justify-content: center; gap: clamp(0.4rem, 2vw, 1.6rem); margin-top: 0.8rem; flex-wrap: wrap; }
        .pTok { position: relative; width: clamp(96px, 15vh, 150px); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
        .pTok svg { width: 100%; height: auto; display: block; filter: drop-shadow(3px 4px 0 rgba(90, 31, 12, 0.35)); }
        .pTok .half { position: absolute; left: 0; right: 0; height: 50%; cursor: pointer; z-index: 2; }
        .pTok .half.up { top: 0; }
        .pTok .half.dn { bottom: 0; }
        .pTok .half:active { background: rgba(255, 255, 255, 0.35); }
        .pTok .half.up:active { border-radius: 50% 50% 0 0; }
        .pTok .half.dn:active { border-radius: 0 0 50% 50%; }
        .pTok .tag { text-align: center; font-size: 0.85rem; margin-top: 2px; }
        .pTok .tag b { font-size: 1.15rem; }
        .floaters { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
        .fl { position: fixed; font-size: 2.2rem; animation: floatUp 0.9s ease-out forwards; -webkit-text-stroke: 5px var(--cream); paint-order: stroke fill; }
        .fl.plus { color: #1c9a2a; }
        .fl.minus { color: #d01818; }
        @keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0) scale(1); } to { opacity: 0; transform: translate(-50%, -70px) scale(1.4); } }
        /* Overlays */
        .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(90, 31, 12, 0.7); display: flex; align-items: center; justify-content: center; padding: 1rem; overflow-y: auto; }
        .panel { background: var(--cream); border: 6px solid var(--orange); border-radius: 26px; box-shadow: 0 0 0 4px var(--ink), 7px 8px 0 4px var(--ink); padding: 1.2rem 1.6rem; max-width: 640px; width: 100%; text-align: center; }
        .panelTitle { margin: 0 0 0.8rem; text-transform: uppercase; font-size: clamp(1.6rem, 5vw, 2.6rem); color: var(--cream); -webkit-text-stroke: 10px var(--orange); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink); }
        .panelBtns { display: flex; gap: 0.8rem; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 1rem; }
        .winList { display: flex; flex-direction: column; gap: 0.5rem; }
        .winRow { display: flex; align-items: center; gap: 0.8rem; background: var(--sky2); border: 4px solid var(--orange); border-radius: 16px; padding: 0.3rem 0.8rem; text-align: left; }
        .winRow.first { background: #ffe08a; transform: scale(1.04); }
        .winRow svg { width: 64px; height: 64px; flex: none; }
        .winRow .who { flex: 1; font-size: 1.5rem; text-transform: uppercase; }
        .winRow .who small { display: block; font-size: 0.7rem; opacity: 0.7; }
        .winRow .pts { font-size: 1.3rem; }
        .qrPanel { max-width: 420px; }
        .qrBox { background: #fff; border: 5px solid var(--ink); border-radius: 12px; padding: 8px; width: 260px; max-width: 100%; margin: 0 auto; }
        .qrBox svg { width: 100%; height: auto; display: block; }
        .qrUrl { word-break: break-all; font-size: 0.85rem; margin-top: 0.6rem; }
        .qrHint { font-size: 0.85rem; margin: 0.3rem 0 0.8rem; }
        /* Wide (desktop/landscape) host screens: the game screen fills the viewport and the
           ladder rows are sized by fitBoard() to whatever height is left, so the whole screen
           fits with no stray scrollbar. Narrow or very short viewports keep the scrolling layout. */
        @media (min-width: 901px) {
            body.playing { overflow: hidden; }
            body.playing #game { display: flex; flex-direction: column; height: calc(100vh - 76px); }
            body.playing #game .board { flex: 1; min-height: 0; }
            body.playing #game .playerBar { flex: none; }
        }
        @media (max-width: 900px) {
            #app { padding: 30px 22px; }
            .board { grid-template-columns: 1fr; }
            .timerCol { flex-direction: row; justify-content: center; }
            .timer { max-width: 120px; }
            .ladderWrap { max-width: 420px; margin: 0 auto; width: 100%; }
        }
        @media (max-width: 480px) {
            .ladderWrap { padding: 24px 14px; }
            .rVal .num { font-size: calc(var(--rowH) * 0.6); }
            .rVal .iq { font-size: calc(var(--rowH) * 0.28); }
            .rank { width: calc(var(--rowH) * 1.05); font-size: calc(var(--rowH) * 0.3); }
        }
        @media (max-width: 420px) { .title { -webkit-text-stroke-width: 10px; } }
    </style>
</head>
<body>
<svg id="scallop" aria-hidden="true"></svg>
<div id="burst"></div>
<div id="app">
    <!-- LOBBY -->
    <section id="lobby" class="screen">
        <a class="back" href="game-hub.html">&larr; Back to Games Hub</a>
        <h1 class="title"><span>Dumb</span><span>Dumber</span><span>Dumbest</span></h1>
        <p class="sub">Pick 2 to 5 brains to play. <b id="pickCount">0 picked</b></p>
        <div id="tokenGrid" class="tokenGrid"></div>
        <div class="lobbyBtns">
            <button id="qrBtn" class="qrBtn" type="button" aria-label="Phone Buzzer QR">
                <span id="qrBtnBrain" class="qrBrain"></span>
                <span>Phone Buzzer QR</span>
            </button>
            <button id="startBtn" class="bigBtn" type="button" disabled>Start Game</button>
        </div>
    </section>

    <!-- GAME -->
    <section id="game" class="screen" hidden>
        <div class="topBar">
            <a class="back" href="game-hub.html">&larr; Back to Games Hub</a>
            <div class="topBtns">
                <button id="buzzBtn" class="smallBtn" type="button">Host Buzz</button>
                <button id="finishBtn" class="smallBtn" type="button">Finish Game</button>
                <button id="lobbyBtn" class="smallBtn" type="button">Lobby</button>
            </div>
        </div>
        <div class="board">
            <div id="ladderWrap" class="ladderWrap"><div id="ladder" class="ladder"></div></div>
            <div class="timerCol">
                <div id="timer" class="timer">
                    <svg viewBox="0 0 120 120" aria-hidden="true">
                        <circle cx="60" cy="60" r="52" class="tBack"></circle>
                        <circle id="tRing" cx="60" cy="60" r="52" class="tRing" transform="rotate(-90 60 60)"></circle>
                    </svg>
                    <div id="timerNum" class="timerNum">6</div>
                </div>
                <div id="timerMsg" class="timerMsg">&nbsp;</div>
            </div>
            <div class="qa">
                <div class="card qCard">
                    <div class="cardLabel">Question</div>
                    <div id="qText" class="cardText">Press Reveal Question to start.</div>
                </div>
                <div class="card aCard">
                    <div class="cardLabel">Answer</div>
                    <div id="aText" class="cardText"></div>
                </div>
                <button id="mainBtn" class="bigBtn" type="button">Reveal Question</button>
                <div id="note" class="note">&nbsp;</div>
            </div>
        </div>
        <div id="playerBar" class="playerBar"></div>
    </section>

    <!-- WINNER -->
    <div id="winner" class="overlay" hidden>
        <div class="panel">
            <h2 class="panelTitle">Final IQ Standings</h2>
            <div id="winList" class="winList"></div>
            <div class="panelBtns">
                <button id="playAgain" class="bigBtn" type="button">Play Again</button>

    if (!h) return;
    t = h.closest('.pTok'); k = +t.getAttribute('data-k');
    changeScore(k, +h.getAttribute('data-d') * 10, h);
});
function changeScore(k, delta, anchor) {
    var pl = players[k], before = pl.score, f, r;
    pl.score = clamp(pl.score + delta);
    $('ps' + k).textContent = pl.score;
    updateLadder();
    f = document.createElement('div');
    f.className = 'fl ' + (delta > 0 ? 'plus' : 'minus');
    f.textContent = (delta > 0 ? '+' : '\u2212') + '10';
    r = anchor.getBoundingClientRect();
    f.style.left = (r.left + r.width / 2) + 'px';
    f.style.top = (delta > 0 ? r.top + 6 : r.bottom - 40) + 'px';
    $('floaters').appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 950);
    if (pl.score === 200 && before < 200) setTimeout(function () { showWinner(); }, 900);
}

/* ---------- Deck (Fisher-Yates, no repeats until exhausted) ---------- */
function shuffleDeck() {
    var i, j, t;
    deck = questions.map(function (q, idx) { return idx; });
    for (i = deck.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
    deckPos = 0;
}
function nextQuestion() {
    var reshuffled = false;
    if (!questions.length) return null;
    if (deckPos >= deck.length) { shuffleDeck(); reshuffled = true; }
    return { q: questions[deck[deckPos++]], reshuffled: reshuffled };
}
/* ---------- Speech (prefers Microsoft Ryan, then en-GB, then any English) ---------- */
var hasSpeech = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
var RYAN = 'Microsoft Ryan Online (Natural) - English (United Kingdom) (en-GB)';
function pickVoice(plain) {
    var v = hasSpeech ? window.speechSynthesis.getVoices() : [], f;
    if (!plain) {
        f = v.find(function (x) { return x.name === RYAN; }) || v.find(function (x) { return /ryan/i.test(x.name) && /en-GB/i.test(x.lang); });
        if (f) return f;
    }
    return v.find(function (x) { return x.lang && /^en-gb/i.test(x.lang) && (!plain || !/online|natural/i.test(x.name)); }) ||
        v.find(function (x) { return x.lang && /^en/i.test(x.lang); }) || null;
}
if (hasSpeech) { window.speechSynthesis.onvoiceschanged = function () {}; window.speechSynthesis.getVoices(); }
var speechToken = 0, safetyTimer = null, startTimer = null;
function stopSpeech() {
    speechToken++;
    if (safetyTimer) { clearTimeout(safetyTimer); safetyTimer = null; }
    if (hasSpeech) { try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
}
/* speak(text, onDone): onDone fires once, on end, on error, or after a safety timeout */
function speak(text, onDone) {
    var my = ++speechToken, done = false, tried = false;
    function finish() {
        if (done || my !== speechToken) return;
        done = true;
        if (safetyTimer) { clearTimeout(safetyTimer); safetyTimer = null; }
        if (onDone) onDone();
    }
    safetyTimer = setTimeout(finish, 3000 + text.length * 120);
    if (!hasSpeech) { setTimeout(finish, 600); return; }
    function go(plain) {
        var u = new SpeechSynthesisUtterance(text), voice = pickVoice(plain);
        if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-GB';
        u.rate = 1; u.pitch = 1;
        u.onend = function () { finish(); };
        u.onerror = function (ev) {
            if (my !== speechToken || done) return;
            if (ev && (ev.error === 'interrupted' || ev.error === 'canceled')) return;
            if (!plain && !tried) { tried = true; try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } setTimeout(function () { if (my === speechToken && !done) go(true); }, 60); }
            else finish();
        };
        try { window.speechSynthesis.speak(u); } catch (e) { finish(); }
    }
    try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    setTimeout(function () { if (my === speechToken && !done) go(false); }, 60);
}

/* ---------- Timer ---------- */
var tLeft = 6, tInt = null, CIRC = 326.7;
/* Time-up sound: plays when the round timer hits zero. Held at 0.5 volume so it
   sits under the full-volume spoken questions and answers. resetTimer() clears it. */
var timeUpAudio = new Audio('/sounds/times-up-sound.mp3');
timeUpAudio.volume = 0.5;
function playTimeUp() {
    try {
        timeUpAudio.currentTime = 0;
        var p = timeUpAudio.play();
        if (p && p.catch) p.catch(function () { /* ignore */ });
    } catch (e) { /* ignore */ }
}
function stopTimeUp() {
    try { timeUpAudio.pause(); timeUpAudio.currentTime = 0; } catch (e) { /* ignore */ }
}
function setTimerView(state) {
    var t = $('timer');
    t.className = 'timer ' + state;
}
function resetTimer() {
    stopTimeUp();          /* next question / new round / back to lobby: drop the old time-up sound */
    clearInterval(tInt); tInt = null; tLeft = 6;
    $('timerNum').textContent = '6'; $('timerMsg').innerHTML = '&nbsp;';
    $('tRing').style.transition = 'none'; $('tRing').style.strokeDashoffset = 0;
    setTimerView('idle');
}
function startTimer6() {
    clearInterval(tInt); tLeft = 6;
    $('timerNum').textContent = '6'; $('timerMsg').textContent = 'Go!';
    setTimerView('run');
    $('tRing').style.transition = 'none'; $('tRing').style.strokeDashoffset = 0;
    void $('tRing').getBoundingClientRect();
    $('tRing').style.transition = 'stroke-dashoffset 1s linear';
    $('tRing').style.strokeDashoffset = (CIRC / 6).toFixed(1);
    tInt = setInterval(function () {
        tLeft--;
        $('timerNum').textContent = tLeft;
        $('tRing').style.strokeDashoffset = (CIRC * (6 - tLeft) / 6).toFixed(1);
        if (tLeft <= 2) $('timer').classList.add('low');
        if (tLeft <= 0) { clearInterval(tInt); tInt = null; timeUp(); }
    }, 1000);
}
function timeUp() {
    phase = 'up';
    playTimeUp();                       /* the 6-second countdown has reached zero */
    setTimerView('up');
    $('timerNum').textContent = "TIME'S UP";
    $('timerMsg').textContent = 'Reveal the answer';
    setMain('Reveal Answer', false);
    $('note').textContent = '';
}
/* ---------- Question flow ---------- */
var waitTimer = null;
function setMain(label, disabled) { $('mainBtn').textContent = label; $('mainBtn').disabled = !!disabled; }
function cancelRound() {
    if (waitTimer) { clearTimeout(waitTimer); waitTimer = null; }
    stopSpeech(); resetTimer();
}
function resetRound() {
    cancelRound();
    phase = 'idle'; current = null;
    $('qText').textContent = 'Press Reveal Question to start.';
    $('aText').textContent = '';
    $('note').innerHTML = '&nbsp;';
    setMain('Reveal Question', !questions.length);
}
function revealQuestion() {
    var nq = nextQuestion();
    if (!nq) { $('note').textContent = 'No questions loaded.'; return; }
    stopSpeech(); resetTimer();         /* clear the finished round before the next one */
    current = nq.q; phase = 'waiting';
    $('aText').textContent = '';
    $('qText').textContent = '...';
    $('note').textContent = nq.reshuffled ? 'Deck reshuffled. Get ready...' : 'Get ready...';
    setMain('Reveal Answer', true);
    waitTimer = setTimeout(function () {
        waitTimer = null; phase = 'speaking';
        $('qText').textContent = current.question;
        $('note').textContent = 'Listen...';
        setMain('Reveal Answer', false);
        speak(current.question, function () {
            if (phase !== 'speaking') return;
            phase = 'timing';
            $('note').innerHTML = '&nbsp;';
            setMain('Reveal Answer', false);
            startTimer6();
        });
    }, 2000);
}
function revealAnswer() {
    if (phase !== 'timing' && phase !== 'up' && phase !== 'speaking') return;
    stopSpeech();                       /* never overlap speech */
    clearInterval(tInt); tInt = null;
    if (phase === 'timing' || phase === 'speaking') { setTimerView('idle'); $('timerMsg').innerHTML = '&nbsp;'; }
    phase = 'answered';
    $('qText').textContent = current.question;
    $('aText').textContent = current.answer;
    $('note').innerHTML = '&nbsp;';
    setMain('Next Question', false);
    speak('The answer is. ' + current.answer, null);
}
$('mainBtn').addEventListener('click', function () {
    /* Next Question goes straight into the next round: reveal (and speak) it, then start the timer */
    if (phase === 'idle' || phase === 'answered') revealQuestion();
    else if (phase === 'timing' || phase === 'up') revealAnswer();
});

/* ---------- Host buzz (Web Audio synth horn) ---------- */
var actx = null;
$('buzzBtn').addEventListener('click', function () {
    try {
        var AC = window.AudioContext || window.webkitAudioContext, o, g, o2;
        if (!AC) return;
        actx = actx || new AC();
        if (actx.state === 'suspended') actx.resume();
        o = actx.createOscillator(); o2 = actx.createOscillator(); g = actx.createGain();
        o.type = 'sawtooth'; o2.type = 'square'; o.frequency.value = 220; o2.frequency.value = 223;
        g.gain.setValueAtTime(0.0001, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.35, actx.currentTime + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.7);
        o.connect(g); o2.connect(g); g.connect(actx.destination);
        o.start(); o2.start(); o.stop(actx.currentTime + 0.75); o2.stop(actx.currentTime + 0.75);
    } catch (e) { /* ignore */ }
});

/* ---------- Winner ---------- */
var TITLES = { 2: ['Einstein', 'Dumbest'], 3: ['Einstein', 'Dumb', 'Dumbest'], 4: ['Einstein', 'Dumb', 'Dumber', 'Dumbest'], 5: ['Einstein', 'Dumb', 'Dumber', 'Dumbest', 'Thicko'] };
function rankPlayers() {
    var order = players.map(function (pl, k) { return { pl: pl, k: k }; });
    var titles = TITLES[players.length] || TITLES[5], out = [], i, rank = 0;
    order.sort(function (a, b) { return b.pl.score - a.pl.score || a.k - b.k; });
    for (i = 0; i < order.length; i++) {
        if (i === 0 || order[i].pl.score !== order[i - 1].pl.score) rank = i;
        out.push({ pl: order[i].pl, rank: rank + 1, title: titles[Math.min(rank, titles.length - 1)] });
    }
    return out;
}
function showWinner() {
    if (!players.length || !$('winner').hidden) return;
    cancelRound();
    var html = '';
    rankPlayers().forEach(function (r) {
        html += '<div class="winRow' + (r.rank === 1 ? ' first' : '') + '">' + tokenSvg(r.pl.p.col, 0) +
            '<div class="who">' + r.title + '<small>#' + r.rank + ' &middot; ' + r.pl.p.name + '</small></div><div class="pts">' + r.pl.score + ' iQ</div></div>';
    });
    $('winList').innerHTML = html;
    $('winner').hidden = false;
}
function resetScores() {
    players.forEach(function (pl, k) { pl.score = 0; $('ps' + k).textContent = '0'; });
    updateLadder();
}
$('finishBtn').addEventListener('click', showWinner);
$('playAgain').addEventListener('click', function () {
    $('winner').hidden = true; resetScores(); shuffleDeck(); resetRound();
});
function toLobby() {
    $('winner').hidden = true; cancelRound(); players = []; show('lobby'); renderLobby();
}
$('winLobby').addEventListener('click', toLobby);
$('lobbyBtn').addEventListener('click', toLobby);

/* ---------- Start + init ---------- */
$('startBtn').addEventListener('click', function () {
    if (picked.length < 2) return;
    players = picked.map(function (i) { return { p: PLAYERS[i], score: 0 }; });
    show('game'); buildLadder(); buildBar(); shuffleDeck(); resetRound();
    fitBoard(); updateLadder();
});
window.addEventListener('resize', function () { if (players.length) { fitBoard(); updateLadder(); } });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('qrModal').hidden = true; });
renderLobby();
fetch('dumb-dumber-questions.json').then(function (r) { return r.json(); }).then(function (list) {
    questions = (Array.isArray(list) ? list : []).filter(function (q) { return q && q.question && q.answer !== undefined; });
    shuffleDeck();
    if (phase === 'idle' && !$('game').hidden) setMain('Reveal Question', !questions.length);
}).catch(function () {
    questions = [];
    $('note').textContent = 'Could not load dumb-dumber-questions.json';
});
})();
</script>
